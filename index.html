<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa's Nexus – Ultimate Web App</title>
  <style>
    /* ===== CSS VARIABLES & RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-glass: rgba(20, 20, 35, 0.65);
      --border-glass: rgba(255, 255, 255, 0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b8;
      --accent-1: #6c5ce7;
      --accent-2: #00cec9;
      --accent-3: #fd79a8;
      --accent-gradient: linear-gradient(135deg, #6c5ce7, #00cec9, #fd79a8);
      --shadow-glow: 0 8px 40px rgba(108, 92, 231, 0.25);
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(108, 92, 231, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(0, 206, 201, 0.06) 0%, transparent 60%);
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-1);
      border-radius: 10px;
    }

    /* ===== GLASS CARD ===== */
    .glass {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      box-shadow: var(--shadow-glow);
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 60px;
      box-shadow: var(--shadow-glow);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .logo span {
      -webkit-text-fill-color: var(--text-primary);
      font-weight: 300;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-tabs button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 8px 18px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    .nav-tabs button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-tabs button.active {
      background: var(--accent-1);
      color: #fff;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.4);
    }

    /* ===== MAIN GRID ===== */
    .app-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .app-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ===== PANELS ===== */
    .panel {
      padding: 24px 28px;
      min-height: 300px;
      transition: 0.3s;
    }

    .panel h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel h2 .icon {
      font-size: 24px;
    }

    /* ===== MOVIE ROW (within panel) ===== */
    .movie-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
      scroll-snap-type: x mandatory;
    }

    .movie-scroll::-webkit-scrollbar {
      height: 4px;
    }
    .movie-scroll::-webkit-scrollbar-thumb {
      background: var(--accent-1);
      border-radius: 10px;
    }

    .movie-card-mini {
      flex: 0 0 140px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-glass);
      transition: 0.3s;
      cursor: pointer;
      scroll-snap-align: start;
    }

    .movie-card-mini:hover {
      transform: scale(1.05);
      border-color: var(--accent-1);
      box-shadow: 0 8px 30px rgba(108, 92, 231, 0.3);
    }

    .movie-card-mini img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
    }

    .movie-card-mini .info {
      padding: 10px 12px 14px;
    }

    .movie-card-mini .info h4 {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-card-mini .info .meta {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
    }

    /* ===== QR GENERATOR ===== */
    .qr-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 8px;
    }

    .qr-row input {
      flex: 1;
      padding: 12px 18px;
      border: 1px solid var(--border-glass);
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 14px;
      outline: none;
      min-width: 160px;
    }

    .qr-row input:focus {
      border-color: var(--accent-1);
    }

    .qr-row button {
      padding: 12px 24px;
      background: var(--accent-gradient);
      border: none;
      border-radius: 60px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-size: 14px;
    }

    .qr-row button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 24px rgba(108, 92, 231, 0.4);
    }

    .qr-result {
      margin-top: 16px;
      display: none;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
    }

    .qr-result.active {
      display: flex;
    }

    .qr-result img {
      max-width: 160px;
      border-radius: 8px;
      background: #fff;
      padding: 8px;
    }

    /* ===== AI VIDEO GENERATOR ===== */
    .ai-input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ai-input-group textarea {
      padding: 14px 18px;
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      font-size: 14px;
      min-height: 80px;
      resize: vertical;
      outline: none;
      font-family: var(--font);
    }

    .ai-input-group textarea:focus {
      border-color: var(--accent-2);
    }

    .ai-input-group input {
      padding: 12px 18px;
      border: 1px solid var(--border-glass);
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .ai-input-group input:focus {
      border-color: var(--accent-2);
    }

    .ai-input-group .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ai-input-group .btn-group button {
      padding: 12px 28px;
      border: none;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-size: 14px;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #fff;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 24px rgba(108, 92, 231, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .ai-status {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 8px;
    }

    .ai-video-container {
      margin-top: 16px;
      display: none;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }

    .ai-video-container.active {
      display: block;
    }

    .ai-video-container video {
      width: 100%;
      display: block;
      max-height: 300px;
    }

    /* ===== STATUS / ERROR ===== */
    .status-msg {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 8px;
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 6px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: stretch;
        border-radius: 28px;
        padding: 16px 20px;
      }
      .nav-tabs {
        justify-content: center;
      }
      .panel {
        padding: 18px 16px;
      }
      .movie-card-mini {
        flex: 0 0 110px;
      }
      .movie-card-mini img {
        height: 150px;
      }
      .qr-row {
        flex-direction: column;
      }
      .qr-row input {
        width: 100%;
      }
      .ai-input-group .btn-group {
        flex-direction: column;
      }
      .ai-input-group .btn-group button {
        width: 100%;
      }
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(16px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel {
      animation: fadeIn 0.6s ease forwards;
    }
    .panel:nth-child(2) {
      animation-delay: 0.1s;
    }
    .panel:nth-child(3) {
      animation-delay: 0.2s;
    }

    /* ===== EMPTY STATES ===== */
    .empty-state {
      color: var(--text-secondary);
      text-align: center;
      padding: 30px 0;
      font-size: 15px;
    }

    /* ===== TOOLTIP ===== */
    .tip {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">Lisa<span>Nexus</span></div>
    <div class="nav-tabs">
      <button class="active" data-tab="movies">🎬 Movies</button>
      <button data-tab="ai">🤖 AI Video</button>
      <button data-tab="qr">📱 QR Code</button>
    </div>
  </header>

  <!-- ===== APP GRID ===== -->
  <div class="app-grid">

    <!-- ===== PANEL 1: MOVIES ===== -->
    <div class="panel glass" id="moviesPanel">
      <h2><span class="icon">🎬</span> Trending Movies</h2>
      <div class="movie-scroll" id="movieScroll">
        <div class="empty-state">Loading movies...</div>
      </div>
      <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" id="movieSearchInput" placeholder="Search movies..." style="flex:1; padding:10px 16px; border:1px solid var(--border-glass); border-radius:60px; background:rgba(255,255,255,0.04); color:#fff; outline:none; font-size:14px;" />
        <button id="movieSearchBtn" style="padding:10px 24px; background:var(--accent-gradient); border:none; border-radius:60px; color:#fff; font-weight:600; cursor:pointer;">Search</button>
      </div>
      <div class="tip">Click any movie to open player (VidSrc / 2Embed)</div>
    </div>

    <!-- ===== PANEL 2: AI VIDEO GENERATOR ===== -->
    <div class="panel glass" id="aiPanel">
      <h2><span class="icon">🤖</span> AI Video Generator</h2>
      <div class="ai-input-group">
        <textarea id="aiPrompt" placeholder="Describe a scene... e.g., 'A cyberpunk city at night with neon lights and flying cars'">A cinematic shot of a futuristic city with holographic billboards, rain, and glowing neon signs</textarea>
        <input type="text" id="aiApiKey" placeholder="Replicate API Key (sk_...)" />
        <div class="btn-group">
          <button class="btn-primary" id="aiGenerateBtn">🎬 Generate Video</button>
          <button class="btn-secondary" id="aiClearBtn">Clear</button>
        </div>
        <div class="ai-status" id="aiStatus">Ready</div>
        <div class="error-msg" id="aiError"></div>
      </div>
      <div class="ai-video-container" id="aiVideoContainer">
        <video id="aiVideoPlayer" controls autoplay></video>
      </div>
    </div>

    <!-- ===== PANEL 3: QR CODE GENERATOR ===== -->
    <div class="panel glass" id="qrPanel" style="grid-column: 1 / -1;">
      <h2><span class="icon">📱</span> QR Code Generator</h2>
      <div class="qr-row">
        <input type="url" id="qrInput" placeholder="https://example.com" value="https://www.google.com" />
        <button id="qrGenerateBtn">Generate QR</button>
      </div>
      <div class="qr-result" id="qrResult">
        <img id="qrImage" src="" alt="QR Code" />
      </div>
      <div class="tip">Custom ad space available – replace the placeholder image in the code.</div>
    </div>

  </div>

  <!-- ===== VIDEO PLAYER OVERLAY ===== -->
  <div class="player-overlay" id="playerOverlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.94); backdrop-filter:blur(12px); display:none; justify-content:center; align-items:center; padding:20px; z-index:999; flex-direction:column;">
    <div style="width:100%; max-width:960px; background:#0d0d0d; border-radius:24px; border:1px solid var(--border-glass); overflow:hidden; position:relative; padding:16px 16px 20px;">
      <button id="closePlayerBtn" style="position:absolute; top:8px; right:16px; background:rgba(0,0,0,0.7); border:none; color:#fff; font-size:30px; width:44px; height:44px; border-radius:50%; cursor:pointer; z-index:10; display:flex; align-items:center; justify-content:center;">&times;</button>
      <div style="font-size:20px; font-weight:600; color:#fff; margin:4px 0 12px; padding-right:50px;" id="playerTitle">Movie Title</div>
      <iframe id="playerIframe" style="width:100%; height:460px; border:none; border-radius:12px; background:#000;" allowfullscreen></iframe>
      <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;" id="sourceSelector">
        <button class="active" data-src="vidsrc" style="padding:8px 20px; border:1px solid var(--border-glass); border-radius:60px; background:transparent; color:#aaa; font-size:14px; cursor:pointer; transition:0.2s;">VidSrc</button>
        <button data-src="2embed" style="padding:8px 20px; border:1px solid var(--border-glass); border-radius:60px; background:transparent; color:#aaa; font-size:14px; cursor:pointer; transition:0.2s;">2Embed</button>
        <button data-src="embed" style="padding:8px 20px; border:1px solid var(--border-glass); border-radius:60px; background:transparent; color:#aaa; font-size:14px; cursor:pointer; transition:0.2s;">Embed</button>
      </div>
      <div style="color:#ff6b6b; font-size:14px; margin-top:10px; display:none;" id="playerError">⚠️ Failed to load video. Try another source.</div>
    </div>
  </div>

  <script>
    // ================================================================
    // CONFIG
    // ================================================================
    const TMDB_API_KEY = 'YOUR_TMDB_API_KEY'; // Get from themoviedb.org
    const BASE_IMAGE = 'https://image.tmdb.org/t/p/w500';

    // ================================================================
    // STATE
    // ================================================================
    let currentPlayingId = null;

    // ================================================================
    // DOM REFS
    // ================================================================
    const movieScroll = document.getElementById('movieScroll');
    const movieSearchInput = document.getElementById('movieSearchInput');
    const movieSearchBtn = document.getElementById('movieSearchBtn');

    const aiPrompt = document.getElementById('aiPrompt');
    const aiApiKey = document.getElementById('aiApiKey');
    const aiGenerateBtn = document.getElementById('aiGenerateBtn');
    const aiClearBtn = document.getElementById('aiClearBtn');
    const aiStatus = document.getElementById('aiStatus');
    const aiError = document.getElementById('aiError');
    const aiVideoContainer = document.getElementById('aiVideoContainer');
    const aiVideoPlayer = document.getElementById('aiVideoPlayer');

    const qrInput = document.getElementById('qrInput');
    const qrGenerateBtn = document.getElementById('qrGenerateBtn');
    const qrResult = document.getElementById('qrResult');
    const qrImage = document.getElementById('qrImage');

    const playerOverlay = document.getElementById('playerOverlay');
    const closePlayerBtn = document.getElementById('closePlayerBtn');
    const playerIframe = document.getElementById('playerIframe');
    const playerTitle = document.getElementById('playerTitle');
    const sourceSelector = document.getElementById('sourceSelector');
    const playerError = document.getElementById('playerError');

    // ================================================================
    // 1. MOVIES
    // ================================================================
    async function fetchMovies(endpoint, limit = 12) {
      try {
        const res = await fetch(
          `https://api.themoviedb.org/3/movie/${endpoint}?api_key=${TMDB_API_KEY}&language=en-US&page=1`
        );
        const data = await res.json();
        return data.results?.slice(0, limit) || [];
      } catch {
        return [];
      }
    }

    function renderMovies(movies) {
      if (!movies || movies.length === 0) {
        movieScroll.innerHTML = `<div class="empty-state">No movies found.</div>`;
        return;
      }
      movieScroll.innerHTML = movies.map(m => {
        const poster = m.poster_path ? `${BASE_IMAGE}${m.poster_path}` :
          'https://via.placeholder.com/500x750/1a1a1a/444?text=No+Poster';
        const rating = m.vote_average ? m.vote_average.toFixed(1) : '—';
        const year = m.release_date ? m.release_date.slice(0, 4) : '—';
        return `
          <div class="movie-card-mini" data-id="${m.id}" data-title="${m.title}">
            <img src="${poster}" alt="${m.title}" loading="lazy" />
            <div class="info">
              <h4>${m.title}</h4>
              <div class="meta">
                <span>${year}</span>
                <span>⭐ ${rating}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      movieScroll.querySelectorAll('.movie-card-mini').forEach(card => {
        card.addEventListener('click', () => {
          openPlayer(card.dataset.id, card.dataset.title);
        });
      });
    }

    async function loadMovies() {
      const popular = await fetchMovies('popular', 12);
      renderMovies(popular);
    }

    async function searchMovies(query) {
      if (!query.trim()) { loadMovies(); return; }
      try {
        const res = await fetch(
          `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&page=1`
        );
        const data = await res.json();
        renderMovies(data.results || []);
      } catch {
        movieScroll.innerHTML = `<div class="empty-state">Search error.</div>`;
      }
    }

    // ================================================================
    // 2. PLAYER
    // ================================================================
    function openPlayer(movieId, title) {
      currentPlayingId = movieId;
      playerTitle.textContent = title;
      playerError.style.display = 'none';
      playerOverlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      const active = sourceSelector.querySelector('button.active');
      loadStream(active ? active.dataset.src : 'vidsrc');
    }

    function closePlayer() {
      playerOverlay.style.display = 'none';
      document.body.style.overflow = '';
      playerIframe.src = '';
      currentPlayingId = null;
    }

    function loadStream(source) {
      if (!currentPlayingId) return;
      playerError.style.display = 'none';
      let embedUrl = '';
      switch (source) {
        case 'vidsrc':
          embedUrl = `https://vidsrc.to/embed/movie/${currentPlayingId}`;
          break;
        case '2embed':
          embedUrl = `https://www.2embed.cc/embed/${currentPlayingId}`;
          break;
        case 'embed':
          embedUrl = `https://embed.su/embed/movie/${currentPlayingId}`;
          break;
        default:
          embedUrl = `https://vidsrc.to/embed/movie/${currentPlayingId}`;
      }
      playerIframe.src = embedUrl;
      sourceSelector.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.src === source));
    }

    // ================================================================
    // 3. AI VIDEO
    // ================================================================
    async function generateAIVideo() {
      const prompt = aiPrompt.value.trim();
      const apiKey = aiApiKey.value.trim();
      if (!prompt) { aiError.textContent = '⚠️ Please enter a prompt.'; return; }
      if (!apiKey) { aiError.textContent = '⚠️ Please enter your Replicate API key.'; return; }
      aiError.textContent = '';
      aiStatus.textContent = '⏳ Generating video... (30-60s)';
      aiGenerateBtn.disabled = true;
      aiVideoContainer.classList.remove('active');
      aiVideoPlayer.src = '';

      try {
        const startRes = await fetch('https://api.replicate.com/v1/predictions', {
          method: 'POST',
          headers: { 'Authorization': `Token ${apiKey}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            version: 'lucataco/hotshot-xl:22d9b42f34c6f4a89f28f5e8f1762dff1eac79c4e0c810ba6c2125b728d7b5c3',
            input: { prompt, seconds: 5, steps: 30, guidance_scale: 7.0, width: 672, height: 384 }
          })
        });
        if (!startRes.ok) { const e = await startRes.json(); throw new Error(e.detail || 'API error'); }
        const startData = await startRes.json();
        const id = startData.id;
        let videoUrl = null;
        for (let i = 0; i < 40; i++) {
          const poll = await fetch(`https://api.replicate.com/v1/predictions/${id}`, {
            headers: { 'Authorization': `Token ${apiKey}` }
          });
          const data = await poll.json();
          if (data.status === 'succeeded') { videoUrl = data.output?.url || data.output; break; }
          if (data.status === 'failed') throw new Error(data.error || 'Generation failed.');
          await new Promise(r => setTimeout(r, 1500));
          aiStatus.textContent = `⏳ Generating... (${i * 1.5}s)`;
        }
        if (!videoUrl) throw new Error('Timeout.');
        aiVideoPlayer.src = videoUrl;
        aiVideoContainer.classList.add('active');
        aiStatus.textContent = '✅ Video generated!';
      } catch (err) {
        aiError.textContent = `❌ ${err.message}`;
        aiStatus.textContent = '❌ Failed.';
      } finally {
        aiGenerateBtn.disabled = false;
      }
    }

    // ================================================================
    // 4. QR CODE
    // ================================================================
    function generateQR() {
      let url = qrInput.value.trim();
      if (!url) { alert('Enter a URL.'); return; }
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
      qrImage.src = qrApi;
      qrResult.classList.add('active');
    }

    // ================================================================
    // 5. TAB SWITCHING
    // ================================================================
    document.querySelectorAll('.nav-tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
        if (tab === 'movies') document.getElementById('moviesPanel').style.display = 'block';
        else if (tab === 'ai') document.getElementById('aiPanel').style.display = 'block';
        else if (tab === 'qr') document.getElementById('qrPanel').style.display = 'block';
        // Reset grid layout for visible panels
        const grid = document.querySelector('.app-grid');
        if (tab === 'qr') {
          grid.style.gridTemplateColumns = '1fr';
          document.getElementById('qrPanel').style.gridColumn = '1 / -1';
        } else {
          grid.style.gridTemplateColumns = '1fr 1fr';
          document.getElementById('qrPanel').style.gridColumn = '1 / -1';
        }
        // Show only the active panel
        document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
        if (tab === 'movies') document.getElementById('moviesPanel').style.display = 'block';
        else if (tab === 'ai') document.getElementById('aiPanel').style.display = 'block';
        else if (tab === 'qr') document.getElementById('qrPanel').style.display = 'block';
        // For movies tab, also show qr panel below
        if (tab === 'movies' || tab === 'ai') {
          document.getElementById('qrPanel').style.display = 'block';
          document.getElementById('qrPanel').style.gridColumn = '1 / -1';
        }
      });
    });

    // ================================================================
    // 6. EVENT LISTENERS
    // ================================================================
    movieSearchBtn.addEventListener('click', () => searchMovies(movieSearchInput.value));
    movieSearchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchMovies(movieSearchInput.value); });

    aiGenerateBtn.addEventListener('click', generateAIVideo);
    aiClearBtn.addEventListener('click', () => { aiPrompt.value = '';
      aiVideoContainer.classList.remove('active');
      aiVideoPlayer.src = '';
      aiStatus.textContent = 'Ready';
      aiError.textContent = ''; });

    qrGenerateBtn.addEventListener('click', generateQR);
    qrInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generateQR(); });

    closePlayerBtn.addEventListener('click', closePlayer);
    playerOverlay.addEventListener('click', (e) => { if (e.target === playerOverlay) closePlayer(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlayer(); });

    sourceSelector.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      sourceSelector.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadStream(btn.dataset.src);
    });

    // ================================================================
    // 7. INIT
    // ================================================================
    if (TMDB_API_KEY === 'YOUR_TMDB_API_KEY') {
      movieScroll.innerHTML = `<div class="empty-state">🔑 Add TMDB API key in the script.</div>`;
    } else {
      loadMovies();
    }

    // Show all panels initially
    document.querySelectorAll('.panel').forEach(p => p.style.display = 'block');
    document.getElementById('qrPanel').style.gridColumn = '1 / -1';

    console.log('[LisaNexus] Ultimate web app ready.');
  </script>
</body>
</html>
