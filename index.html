<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LisaFlix – Watch Movies</title>
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0b0b;
      color: #e0e0e0;
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 12px 0 20px;
      border-bottom: 1px solid #222;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .logo span {
      color: #4a9eff;
    }

    .search-box {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box input {
      padding: 10px 18px;
      border: 1px solid #2a2a2a;
      border-radius: 60px;
      background: #1a1a1a;
      color: #fff;
      font-size: 15px;
      min-width: 200px;
      outline: none;
      transition: 0.25s;
    }

    .search-box input:focus {
      border-color: #4a9eff;
      background: #1e1e1e;
    }
    .search-box input::placeholder {
      color: #555;
    }

    .search-box button {
      padding: 10px 24px;
      background: #4a9eff;
      color: #fff;
      border: none;
      border-radius: 60px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-box button:hover {
      background: #3a8aee;
      transform: scale(1.02);
    }

    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 20px;
    }

    .filter-group button {
      padding: 6px 18px;
      border: 1px solid #2a2a2a;
      border-radius: 60px;
      background: transparent;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }

    .filter-group button:hover,
    .filter-group button.active {
      background: #4a9eff;
      color: #fff;
      border-color: #4a9eff;
    }

    /* ===== MOVIE GRID ===== */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 22px;
      margin-top: 16px;
    }

    .movie-card {
      background: #141414;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #222;
      transition: 0.25s;
      cursor: pointer;
    }

    .movie-card:hover {
      transform: scale(1.04);
      border-color: #4a9eff;
      box-shadow: 0 8px 30px rgba(74, 158, 255, 0.15);
    }

    .movie-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      background: #1a1a1a;
    }

    .movie-card .info {
      padding: 12px 14px 16px;
    }

    .movie-card .info h3 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-card .info .meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #888;
    }

    .movie-card .info .rating {
      color: #f5c518;
      font-weight: 600;
    }

    /* ===== VIDEO PLAYER MODAL ===== */
    .player-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 999;
      flex-direction: column;
    }

    .player-overlay.active {
      display: flex;
    }

    .player-box {
      width: 100%;
      max-width: 960px;
      background: #0d0d0d;
      border-radius: 20px;
      border: 1px solid #2a2a2a;
      overflow: hidden;
      position: relative;
      padding: 16px 16px 20px;
    }

    .player-box .close-btn {
      position: absolute;
      top: 8px;
      right: 16px;
      background: none;
      border: none;
      color: #888;
      font-size: 30px;
      cursor: pointer;
      z-index: 10;
      transition: 0.2s;
    }

    .player-box .close-btn:hover {
      color: #fff;
    }

    .player-box .movie-title {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      margin: 4px 0 12px;
      padding-right: 40px;
    }

    .player-box iframe {
      width: 100%;
      height: 460px;
      border: none;
      border-radius: 12px;
      background: #000;
    }

    .player-box .source-selector {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .player-box .source-selector button {
      padding: 8px 20px;
      border: 1px solid #2a2a2a;
      border-radius: 60px;
      background: transparent;
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .player-box .source-selector button:hover,
    .player-box .source-selector button.active {
      background: #4a9eff;
      color: #fff;
      border-color: #4a9eff;
    }

    .player-box .error-msg {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    /* ===== LOADING / EMPTY ===== */
    .loading,
    .empty {
      text-align: center;
      color: #666;
      padding: 60px 0;
      font-size: 18px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box input {
        min-width: 0;
        width: 100%;
      }
      .search-box button {
        width: 100%;
      }
      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 14px;
      }
      .movie-card img {
        height: 200px;
      }
      .player-box iframe {
        height: 240px;
      }
      .player-box .movie-title {
        font-size: 17px;
      }
    }

    @media (min-width: 641px) and (max-width: 1024px) {
      .player-box iframe {
        height: 380px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <header>
    <div class="logo">Lisa<span>Flix</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search movies..." />
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <!-- GENRE FILTERS -->
  <div class="filter-group" id="genreFilters">
    <button class="active" data-genre="">All</button>
    <button data-genre="28">Action</button>
    <button data-genre="35">Comedy</button>
    <button data-genre="18">Drama</button>
    <button data-genre="27">Horror</button>
    <button data-genre="878">Sci-Fi</button>
    <button data-genre="10749">Romance</button>
    <button data-genre="99">Documentary</button>
  </div>

  <!-- MOVIE GRID -->
  <div id="movieGrid" class="movie-grid">
    <div class="loading">Loading movies...</div>
  </div>
</div>

<!-- ===== VIDEO PLAYER OVERLAY ===== -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-box">
    <button class="close-btn" id="closePlayerBtn">&times;</button>
    <div class="movie-title" id="playerTitle">Movie Title</div>
    <iframe id="playerIframe" src="" allowfullscreen></iframe>
    <div class="source-selector" id="sourceSelector">
      <button class="active" data-src="vidsrc">VidSrc</button>
      <button data-src="2embed">2Embed</button>
      <button data-src="embed">Embed</button>
    </div>
    <div class="error-msg" id="playerError">⚠️ Failed to load video. Try another source.</div>
  </div>
</div>

<script>
  // ================================================================
  // CONFIGURATION – GET FREE TMDB API KEY
  // ================================================================
  const TMDB_API_KEY = 'YOUR_TMDB_API_KEY'; // ← PALITAN ITO
  const BASE_IMAGE = 'https://image.tmdb.org/t/p/w500';

  // ================================================================
  // STATE
  // ================================================================
  let currentPage = 1;
  let currentGenre = '';
  let currentQuery = '';
  let isLoading = false;
  let currentMovieId = null;
  let currentTitle = '';

  // ================================================================
  // DOM REFS
  // ================================================================
  const grid = document.getElementById('movieGrid');
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const genreFilters = document.getElementById('genreFilters');

  const playerOverlay = document.getElementById('playerOverlay');
  const closePlayerBtn = document.getElementById('closePlayerBtn');
  const playerIframe = document.getElementById('playerIframe');
  const playerTitle = document.getElementById('playerTitle');
  const sourceSelector = document.getElementById('sourceSelector');
  const playerError = document.getElementById('playerError');

  // ================================================================
  // FETCH MOVIES
  // ================================================================
  async function fetchMovies(page = 1) {
    if (isLoading) return;
    isLoading = true;
    grid.innerHTML = '<div class="loading">Loading...</div>';

    try {
      let url;
      if (currentQuery.trim()) {
        url =
          `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(currentQuery)}&page=${page}`;
      } else if (currentGenre) {
        url =
          `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&with_genres=${currentGenre}&page=${page}&sort_by=popularity.desc`;
      } else {
        url = `https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_API_KEY}&page=${page}`;
      }

      const res = await fetch(url);
      const data = await res.json();

      if (data.results && data.results.length > 0) {
        renderMovies(data.results);
      } else {
        grid.innerHTML = '<div class="empty">No movies found.</div>';
      }
    } catch (err) {
      grid.innerHTML = '<div class="empty">Error loading movies. Check your API key.</div>';
      console.error(err);
    }

    isLoading = false;
  }

  // ================================================================
  // RENDER MOVIES
  // ================================================================
  function renderMovies(movies) {
    grid.innerHTML = movies.map(m => {
      const poster = m.poster_path ?
        `${BASE_IMAGE}${m.poster_path}` :
        'https://via.placeholder.com/500x750/1a1a1a/444?text=No+Poster';
      const rating = m.vote_average ? m.vote_average.toFixed(1) : '—';
      const year = m.release_date ? m.release_date.slice(0, 4) : '—';
      return `
        <div class="movie-card" data-id="${m.id}" data-title="${m.title}">
          <img src="${poster}" alt="${m.title}" loading="lazy" />
          <div class="info">
            <h3>${m.title}</h3>
            <div class="meta">
              <span>${year}</span>
              <span class="rating">⭐ ${rating}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // Click to open player
    grid.querySelectorAll('.movie-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.dataset.id;
        const title = card.dataset.title;
        openPlayer(id, title);
      });
    });
  }

  // ================================================================
  // PLAYER – OPEN & LOAD STREAM
  // ================================================================
  function openPlayer(movieId, title) {
    currentMovieId = movieId;
    currentTitle = title;
    playerTitle.textContent = title;
    playerError.style.display = 'none';
    playerOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    // Load default source
    const activeSource = sourceSelector.querySelector('button.active');
    if (activeSource) {
      loadStream(activeSource.dataset.src);
    } else {
      loadStream('vidsrc');
    }
  }

  function closePlayer() {
    playerOverlay.classList.remove('active');
    document.body.style.overflow = '';
    playerIframe.src = '';
    currentMovieId = null;
  }

  function loadStream(source) {
    if (!currentMovieId) return;
    playerError.style.display = 'none';

    let embedUrl = '';
    switch (source) {
      case 'vidsrc':
        embedUrl = `https://vidsrc.to/embed/movie/${currentMovieId}`;
        break;
      case '2embed':
        embedUrl = `https://www.2embed.cc/embed/${currentMovieId}`;
        break;
      case 'embed':
        embedUrl = `https://embed.su/embed/movie/${currentMovieId}`;
        break;
      default:
        embedUrl = `https://vidsrc.to/embed/movie/${currentMovieId}`;
    }

    playerIframe.src = embedUrl;

    // Mark active button
    sourceSelector.querySelectorAll('button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.src === source);
    });
  }

  // ================================================================
  // EVENT LISTENERS
  // ================================================================
  // Search
  searchBtn.addEventListener('click', () => {
    currentQuery = searchInput.value.trim();
    currentPage = 1;
    fetchMovies();
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      currentQuery = searchInput.value.trim();
      currentPage = 1;
      fetchMovies();
    }
  });

  // Genre filters
  genreFilters.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    genreFilters.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentGenre = btn.dataset.genre || '';
    currentQuery = '';
    searchInput.value = '';
    currentPage = 1;
    fetchMovies();
  });

  // Player controls
  closePlayerBtn.addEventListener('click', closePlayer);
  playerOverlay.addEventListener('click', (e) => {
    if (e.target === playerOverlay) closePlayer();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePlayer();
  });

  // Source switching
  sourceSelector.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    sourceSelector.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadStream(btn.dataset.src);
  });

  // ================================================================
  // INFINITE SCROLL
  // ================================================================
  let observer = new IntersectionObserver((entries) => {
    const last = entries[0];
    if (last.isIntersecting && !isLoading) {
      currentPage++;
      fetchMovies(currentPage);
    }
  }, { rootMargin: '200px' });

  const origRender = renderMovies;
  renderMovies = function(movies) {
    origRender(movies);
    const cards = grid.querySelectorAll('.movie-card');
    if (cards.length > 0) {
      observer.observe(cards[cards.length - 1]);
    }
  };

  // ================================================================
  // INIT
  // ================================================================
  if (TMDB_API_KEY === 'e0a7266a5d0e95c36475f349d8bc0a5a') {
    grid.innerHTML = `
      <div class="empty" style="padding:40px; background:#141414; border-radius:16px; border:1px solid #2a2a2a;">
        <p style="font-size:18px; margin-bottom:8px;">🔑 Kailangan mo ng TMDB API key</p>
        <p style="font-size:14px; color:#666;">
          Pumunta sa <a href="https://www.themoviedb.org/signup" target="_blank" style="color:#4a9eff;">themoviedb.org</a>,
          gumawa ng account, at kumuha ng API key. <br />
          Pagkatapos, palitan ang <code style="background:#222; padding:2px 8px; border-radius:4px;">TMDB_API_KEY</code> sa script.
        </p>
      </div>
    `;
  } else {
    fetchMovies();
  }

  console.log('[LisaFlix] Streaming ready. API Key:', TMDB_API_KEY ? '✅ set' : '❌ missing');
</script>
</body>
</html>
