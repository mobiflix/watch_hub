<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Personal Blog</title>
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b0b0f;
      color: #e0e0e0;
      padding: 30px 20px 60px;
      min-height: 100vh;
      background-image: radial-gradient(circle at 20% 30%, rgba(74, 158, 255, 0.04) 0%, transparent 60%);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #4a9eff, #6c5ce7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    header .controls button {
      padding: 8px 20px;
      border: none;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-new {
      background: #4a9eff;
      color: #fff;
    }

    .btn-new:hover {
      background: #3a8aee;
      transform: scale(1.02);
    }

    .btn-lock {
      background: rgba(255, 255, 255, 0.06);
      color: #aaa;
    }

    .btn-lock:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-lock.unlocked {
      background: #ff6b6b;
      color: #fff;
    }

    .btn-lock.unlocked:hover {
      background: #e55555;
    }

    /* ===== POST FORM ===== */
    .post-form {
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 24px 28px;
      margin-bottom: 32px;
      display: none;
    }

    .post-form.open {
      display: block;
    }

    .post-form input,
    .post-form textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      font-family: inherit;
      margin-bottom: 12px;
    }

    .post-form input:focus,
    .post-form textarea:focus {
      border-color: #4a9eff;
      background: rgba(0, 0, 0, 0.6);
    }

    .post-form textarea {
      min-height: 140px;
      resize: vertical;
    }

    .post-form .form-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .post-form .form-actions button {
      padding: 10px 24px;
      border: none;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-publish {
      background: #4a9eff;
      color: #fff;
    }

    .btn-publish:hover {
      background: #3a8aee;
      transform: scale(1.02);
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.06);
      color: #aaa;
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* ===== BLOG POSTS ===== */
    .post {
      background: rgba(16, 16, 24, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 24px 28px;
      margin-bottom: 24px;
      transition: 0.2s;
    }

    .post:hover {
      border-color: rgba(74, 158, 255, 0.1);
    }

    .post .post-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .post .post-title {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
    }

    .post .post-date {
      font-size: 13px;
      color: #666;
      white-space: nowrap;
    }

    .post .post-content {
      color: #ccc;
      font-size: 16px;
      line-height: 1.7;
      margin-top: 6px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .post .post-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
    }

    .post .post-actions button {
      padding: 6px 16px;
      border: none;
      border-radius: 60px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      background: rgba(255, 255, 255, 0.04);
      color: #888;
    }

    .post .post-actions button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .post .post-actions .delete-btn:hover {
      background: #ff6b6b;
      color: #fff;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #555;
      font-size: 18px;
    }

    .empty-state span {
      font-size: 56px;
      display: block;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 30, 0.9);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 12px 28px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: 0.4s;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }
      .post-form {
        padding: 18px 16px;
      }
      .post {
        padding: 18px 16px;
      }
      .post .post-title {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ===== HEADER ===== -->
  <header>
    <h1>✍️ My Blog</h1>
    <div class="controls">
      <button class="btn-new" id="newPostBtn">+ New Post</button>
      <button class="btn-lock" id="lockBtn">🔒 Locked</button>
    </div>
  </header>

  <!-- ===== POST FORM ===== -->
  <div class="post-form" id="postForm">
    <input type="text" id="postTitleInput" placeholder="Post title..." />
    <textarea id="postContentInput" placeholder="Write your post here..."></textarea>
    <div class="form-actions">
      <button class="btn-publish" id="publishBtn">📝 Publish</button>
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
    </div>
  </div>

  <!-- ===== BLOG POSTS ===== -->
  <div id="postsContainer">
    <div class="empty-state">
      <span>📝</span>
      No posts yet.<br />Click "New Post" to write your first entry.
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
  // ================================================================
  // CONFIG – CHANGE YOUR PASSWORD HERE
  // ================================================================
  const OWNER_PASSWORD = 'admin123'; // ← PALITAN ITO

  // ================================================================
  // STATE
  // ================================================================
  let posts = [];
  let isUnlocked = false;
  let editingIndex = null;

  // ================================================================
  // DOM REFS
  // ================================================================
  const postsContainer = document.getElementById('postsContainer');
  const postForm = document.getElementById('postForm');
  const postTitleInput = document.getElementById('postTitleInput');
  const postContentInput = document.getElementById('postContentInput');
  const publishBtn = document.getElementById('publishBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const newPostBtn = document.getElementById('newPostBtn');
  const lockBtn = document.getElementById('lockBtn');
  const toast = document.getElementById('toast');

  // ================================================================
  // STORAGE
  // ================================================================
  function loadPosts() {
    try {
      const raw = localStorage.getItem('blogPosts');
      if (raw) {
        posts = JSON.parse(raw);
        if (!Array.isArray(posts)) posts = [];
      } else {
        // Default sample posts
        posts = [
          { id: Date.now() + 1, title: 'Hello, World!', content: 'Welcome to my blog. This is my first post.', date: new Date().toLocaleDateString() },
          { id: Date.now() + 2, title: 'My Second Post', content: 'This is another post. I love blogging!', date: new Date().toLocaleDateString() }
        ];
        savePosts();
      }
    } catch {
      posts = [];
    }
  }

  function savePosts() {
    localStorage.setItem('blogPosts', JSON.stringify(posts));
  }

  // ================================================================
  // RENDER POSTS
  // ================================================================
  function renderPosts() {
    if (!posts || posts.length === 0) {
      postsContainer.innerHTML = `
        <div class="empty-state">
          <span>📝</span>
          No posts yet.<br />Click "New Post" to write your first entry.
        </div>
      `;
      return;
    }

    // Sort by newest first
    const sorted = [...posts].reverse();

    postsContainer.innerHTML = sorted.map((post, index) => {
      const realIndex = posts.length - 1 - index;
      const actions = isUnlocked ? `
        <div class="post-actions">
          <button class="delete-btn" data-index="${realIndex}">🗑️ Delete</button>
        </div>
      ` : '';

      return `
        <div class="post">
          <div class="post-header">
            <div class="post-title">${post.title || 'Untitled'}</div>
            <div class="post-date">${post.date || '—'}</div>
          </div>
          <div class="post-content">${post.content || ''}</div>
          ${actions}
        </div>
      `;
    }).join('');

    // Attach delete events if unlocked
    if (isUnlocked) {
      postsContainer.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.index);
          deletePost(idx);
        });
      });
    }
  }

  // ================================================================
  // CRUD OPERATIONS
  // ================================================================
  function addPost(title, content) {
    if (!isUnlocked) {
      showToast('🔒 Unlock first to publish.');
      return false;
    }
    if (!title.trim() || !content.trim()) {
      showToast('⚠️ Please fill in both title and content.');
      return false;
    }

    posts.push({
      id: Date.now(),
      title: title.trim(),
      content: content.trim(),
      date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
    });

    savePosts();
    renderPosts();
    showToast('✅ Post published!');
    closeForm();
    return true;
  }

  function deletePost(index) {
    if (!isUnlocked) {
      showToast('🔒 Unlock first to delete.');
      return;
    }
    if (!confirm('Delete this post?')) return;
    posts.splice(index, 1);
    savePosts();
    renderPosts();
    showToast('🗑️ Post deleted.');
  }

  // ================================================================
  // FORM CONTROLS
  // ================================================================
  function openForm(editIndex = null) {
    if (!isUnlocked) {
      showToast('🔒 Unlock first to write.');
      return;
    }
    editingIndex = editIndex;
    if (editIndex !== null && posts[editIndex]) {
      postTitleInput.value = posts[editIndex].title;
      postContentInput.value = posts[editIndex].content;
      publishBtn.textContent = '💾 Update';
    } else {
      postTitleInput.value = '';
      postContentInput.value = '';
      publishBtn.textContent = '📝 Publish';
    }
    postForm.classList.add('open');
    postTitleInput.focus();
  }

  function closeForm() {
    postForm.classList.remove('open');
    postTitleInput.value = '';
    postContentInput.value = '';
    editingIndex = null;
    publishBtn.textContent = '📝 Publish';
  }

  // ================================================================
  // LOCK / UNLOCK
  // ================================================================
  function toggleLock() {
    if (isUnlocked) {
      lock();
    } else {
      const pass = prompt('Enter password to unlock:');
      if (pass === OWNER_PASSWORD) {
        unlock();
      } else if (pass !== null) {
        showToast('❌ Wrong password.');
      }
    }
  }

  function unlock() {
    isUnlocked = true;
    lockBtn.textContent = '🔓 Unlocked';
    lockBtn.classList.add('unlocked');
    showToast('🔓 Unlocked! You can now write and delete.');
    renderPosts();
  }

  function lock() {
    isUnlocked = false;
    lockBtn.textContent = '🔒 Locked';
    lockBtn.classList.remove('unlocked');
    closeForm();
    renderPosts();
    showToast('🔒 Locked. View only mode.');
  }

  // ================================================================
  // TOAST
  // ================================================================
  let toastTimer;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
  }

  // ================================================================
  // EVENT LISTENERS
  // ================================================================
  newPostBtn.addEventListener('click', () => openForm());

  cancelBtn.addEventListener('click', closeForm);

  publishBtn.addEventListener('click', () => {
    addPost(postTitleInput.value, postContentInput.value);
  });

  lockBtn.addEventListener('click', toggleLock);

  // Enter key in title field moves to content
  postTitleInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      postContentInput.focus();
    }
  });

  // Ctrl+Enter in content publishes
  postContentInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      publishBtn.click();
    }
  });

  // ================================================================
  // INIT
  // ================================================================
  loadPosts();
  renderPosts();
  // Start locked by default
  lock();

  console.log('[MyBlog] Ready. Password protected.');
</script>
</body>
</html>
