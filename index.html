<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Image Grid – Uniform Images</title>
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0b0b;
      color: #e0e0e0;
      padding: 30px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .sub {
      color: #888;
      font-size: 15px;
      margin-bottom: 28px;
    }

    /* ===== LOCK BAR ===== */
    .lock-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .lock-bar .status {
      font-size: 14px;
      color: #888;
    }

    .lock-bar .status .locked {
      color: #ff4757;
    }

    .lock-bar .status .unlocked {
      color: #4a9eff;
    }

    .lock-bar input {
      padding: 8px 16px;
      border: 1px solid #2a2a2a;
      border-radius: 60px;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
      outline: none;
      width: 160px;
      transition: 0.2s;
    }

    .lock-bar input:focus {
      border-color: #4a9eff;
    }

    .lock-bar button {
      padding: 8px 20px;
      border: none;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-unlock {
      background: #4a9eff;
      color: #fff;
    }

    .btn-unlock:hover {
      background: #3a8aee;
    }

    .btn-lock {
      background: #ff4757;
      color: #fff;
    }

    .btn-lock:hover {
      background: #e63946;
    }

    /* ===== FORM (visible only when unlocked) ===== */
    .form-panel {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 24px 28px;
      margin-bottom: 32px;
      display: none;
    }

    .form-panel.open {
      display: block;
    }

    .form-panel h3 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    .form-group input:focus {
      border-color: #4a9eff;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: #4a9eff;
      color: #fff;
    }

    .btn-primary:hover {
      background: #3a8aee;
      transform: scale(1.02);
    }

    .btn-danger {
      background: #ff4757;
      color: #fff;
    }

    .btn-danger:hover {
      background: #e63946;
    }

    .btn-secondary {
      background: #2a2a2a;
      color: #ddd;
    }

    .btn-secondary:hover {
      background: #3a3a3a;
    }

    /* ===== GRID – 2 columns on ALL screens ===== */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 20px;
    }

    /* ===== MOBILE: still 2 columns, smaller gap & images ===== */
    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      /* --- UNIFORM IMAGE SIZE FOR MOBILE --- */
      .grid-item img {
        width: 100%;
        height: 160px;
        object-fit: cover;
      }

      .grid-item .info .label {
        max-width: 80px;
        font-size: 11px;
      }

      .grid-item .info .actions button {
        font-size: 13px;
        padding: 2px 4px;
      }

      .lock-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .lock-bar input {
        width: 100%;
      }

      .lock-bar button {
        width: 100%;
      }
    }

    /* ===== VERY SMALL SCREENS (< 400px) – 1 column ===== */
    @media (max-width: 400px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .grid-item img {
        height: 220px;
      }
    }

    .grid-item {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      overflow: hidden;
      transition: 0.25s;
      position: relative;
    }

    .grid-item:hover {
      border-color: #4a9eff;
      box-shadow: 0 8px 30px rgba(74, 158, 255, 0.1);
    }

    .grid-item a {
      display: block;
      text-decoration: none;
    }

    /* ===== UNIFORM IMAGE SIZE – FIXED DIMENSIONS ===== */
    .grid-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #1a1a1a;
    }

    .grid-item .info {
      padding: 14px 16px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .grid-item .info .label {
      color: #aaa;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .grid-item .info .actions {
      display: flex;
      gap: 8px;
    }

    .grid-item .info .actions button {
      background: transparent;
      border: none;
      color: #888;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      padding: 4px 6px;
      border-radius: 6px;
    }

    .grid-item .info .actions button:hover {
      color: #fff;
      background: #2a2a2a;
    }

    .grid-item .info .actions .edit-btn:hover {
      color: #4a9eff;
    }

    .grid-item .info .actions .delete-btn:hover {
      color: #ff4757;
    }

    /* ===== EDIT INLINE ===== */
    .edit-inline {
      padding: 16px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      display: none;
    }

    .edit-inline.open {
      display: block;
    }

    .edit-inline .form-group {
      margin-bottom: 10px;
    }

    .edit-inline .form-group input {
      padding: 8px 12px;
      font-size: 13px;
    }

    .edit-inline .edit-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .edit-inline .edit-actions button {
      padding: 6px 18px;
      border: none;
      border-radius: 60px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .edit-inline .edit-actions .save-edit {
      background: #4a9eff;
      color: #fff;
    }

    .edit-inline .edit-actions .save-edit:hover {
      background: #3a8aee;
    }

    .edit-inline .edit-actions .cancel-edit {
      background: #2a2a2a;
      color: #ddd;
    }

    .edit-inline .edit-actions .cancel-edit:hover {
      background: #3a3a3a;
    }

    /* ===== HIDE EDIT CONTROLS WHEN LOCKED ===== */
    .grid-item .info .actions.hidden-actions {
      display: none !important;
    }

    .edit-inline.hidden-edit {
      display: none !important;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #555;
      font-size: 18px;
    }

    .empty-state span {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2a2a2a;
      color: #fff;
      padding: 12px 28px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: 0.4s;
      pointer-events: none;
      border: 1px solid #3a3a3a;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🖼️ Private Image Grid</h1>
  <p class="sub">2 images per row — click any image to visit its link.</p>

  <!-- ===== LOCK BAR ===== -->
  <div class="lock-bar">
    <div class="status">
      Status: <span id="lockStatus" class="locked">🔒 Locked</span>
    </div>
    <input type="password" id="passwordInput" placeholder="Enter password" />
    <button id="lockToggleBtn" class="btn-unlock">🔓 Unlock</button>
  </div>

  <!-- ===== FORM (visible only when unlocked) ===== -->
  <div class="form-panel" id="formPanel">
    <h3>➕ Add New Image</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Image URL</label>
        <input type="url" id="imageUrlInput" placeholder="https://example.com/image.jpg" />
      </div>
      <div class="form-group">
        <label>Link URL (destination)</label>
        <input type="url" id="linkUrlInput" placeholder="https://example.com" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="addBtn">➕ Add Image</button>
      <button class="btn btn-secondary" id="resetBtn">🗑️ Reset All</button>
    </div>
  </div>

  <!-- ===== GRID ===== -->
  <div class="grid" id="gridContainer">
    <div class="empty-state">
      <span>📸</span>
      No images yet.<br />Add your first image above.
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
  // ================================================================
  // CONFIG – CHANGE YOUR PASSWORD HERE
  // ================================================================
  const OWNER_PASSWORD = 'admin123'; // ← PALITAN ITO

  // ================================================================
  // STATE
  // ================================================================
  let items = [];
  let isUnlocked = false;

  // ================================================================
  // DOM REFS
  // ================================================================
  const grid = document.getElementById('gridContainer');
  const imageUrlInput = document.getElementById('imageUrlInput');
  const linkUrlInput = document.getElementById('linkUrlInput');
  const addBtn = document.getElementById('addBtn');
  const resetBtn = document.getElementById('resetBtn');
  const toast = document.getElementById('toast');
  const passwordInput = document.getElementById('passwordInput');
  const lockToggleBtn = document.getElementById('lockToggleBtn');
  const lockStatus = document.getElementById('lockStatus');
  const formPanel = document.getElementById('formPanel');

  // ================================================================
  // STORAGE
  // ================================================================
  function loadData() {
    try {
      const raw = localStorage.getItem('imageGridItems');
      if (raw) {
        items = JSON.parse(raw);
        if (!Array.isArray(items)) items = [];
      } else {
        // Default sample data
        items = [
          { id: Date.now() + 1, image: 'https://picsum.photos/seed/1/600/400', link: 'https://example.com/1' },
          { id: Date.now() + 2, image: 'https://picsum.photos/seed/2/600/400', link: 'https://example.com/2' },
          { id: Date.now() + 3, image: 'https://picsum.photos/seed/3/600/400', link: 'https://example.com/3' },
          { id: Date.now() + 4, image: 'https://picsum.photos/seed/4/600/400', link: 'https://example.com/4' }
        ];
        saveData();
      }
    } catch {
      items = [];
    }
  }

  function saveData() {
    localStorage.setItem('imageGridItems', JSON.stringify(items));
  }

  // ================================================================
  // RENDER GRID
  // ================================================================
  function renderGrid() {
    if (!items || items.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <span>📸</span>
          No images yet.<br />Add your first image above.
        </div>
      `;
      return;
    }

    grid.innerHTML = items.map((item, index) => {
      const actionClass = isUnlocked ? '' : 'hidden-actions';
      const editClass = isUnlocked ? '' : 'hidden-edit';
      return `
        <div class="grid-item" data-index="${index}">
          <a href="${item.link || '#'}" target="_blank" rel="noopener">
            <img src="${item.image || 'https://via.placeholder.com/600x400/1a1a1a/444?text=No+Image'}" alt="Image ${index + 1}" loading="lazy" />
          </a>
          <div class="info">
            <span class="label" title="${item.link || ''}">${item.link ? item.link.slice(0, 40) + (item.link.length > 40 ? '…' : '') : 'No link'}</span>
            <div class="actions ${actionClass}">
              <button class="edit-btn" data-index="${index}" title="Edit">✏️</button>
              <button class="delete-btn" data-index="${index}" title="Delete">🗑️</button>
            </div>
          </div>
          <!-- Edit inline -->
          <div class="edit-inline ${editClass}" id="edit-${index}">
            <div class="form-group">
              <label>Image URL</label>
              <input type="url" class="edit-image-input" value="${item.image || ''}" />
            </div>
            <div class="form-group">
              <label>Link URL</label>
              <input type="url" class="edit-link-input" value="${item.link || ''}" />
            </div>
            <div class="edit-actions">
              <button class="save-edit" data-index="${index}">💾 Save</button>
              <button class="cancel-edit" data-index="${index}">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // Attach events only if unlocked
    if (isUnlocked) {
      // Delete
      grid.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.index);
          deleteItem(idx);
        });
      });

      // Edit – show inline form
      grid.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.index);
          toggleEdit(idx, true);
        });
      });

      // Save edit
      grid.querySelectorAll('.save-edit').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.index);
          saveEdit(idx);
        });
      });

      // Cancel edit
      grid.querySelectorAll('.cancel-edit').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.index);
          toggleEdit(idx, false);
        });
      });
    }
  }

  // ================================================================
  // CRUD OPERATIONS
  // ================================================================
  function addItem(image, link) {
    if (!isUnlocked) {
      showToast('🔒 Unlock first to add images.');
      return false;
    }
    if (!image.trim()) {
      showToast('⚠️ Please enter an image URL.');
      return false;
    }
    items.push({
      id: Date.now(),
      image: image.trim(),
      link: link.trim() || '#'
    });
    saveData();
    renderGrid();
    showToast('✅ Image added!');
    imageUrlInput.value = '';
    linkUrlInput.value = '';
    return true;
  }

  function deleteItem(index) {
    if (!isUnlocked) {
      showToast('🔒 Unlock first to delete.');
      return;
    }
    if (index < 0 || index >= items.length) return;
    if (!confirm('Delete this image?')) return;
    items.splice(index, 1);
    saveData();
    renderGrid();
    showToast('🗑️ Image deleted.');
  }

  function saveEdit(index) {
    if (!isUnlocked) {
      showToast('🔒 Unlock first to edit.');
      return;
    }
    const card = grid.querySelector(`.grid-item[data-index="${index}"]`);
    if (!card) return;
    const imgInput = card.querySelector('.edit-image-input');
    const linkInput = card.querySelector('.edit-link-input');
    const newImage = imgInput.value.trim();
    const newLink = linkInput.value.trim();

    if (!newImage) {
      showToast('⚠️ Image URL cannot be empty.');
      return;
    }

    items[index].image = newImage;
    items[index].link = newLink || '#';
    saveData();
    renderGrid();
    showToast('✅ Updated!');
  }

  function toggleEdit(index, show) {
    if (!isUnlocked) {
      showToast('🔒 Unlock first to edit.');
      return;
    }
    const card = grid.querySelector(`.grid-item[data-index="${index}"]`);
    if (!card) return;
    const editPanel = card.querySelector('.edit-inline');
    if (editPanel) {
      editPanel.classList.toggle('open', show);
      if (show) {
        const imgInput = editPanel.querySelector('.edit-image-input');
        const linkInput = editPanel.querySelector('.edit-link-input');
        if (imgInput) imgInput.value = items[index].image || '';
        if (linkInput) linkInput.value = items[index].link || '';
      }
    }
  }

  function resetAll() {
    if (!isUnlocked) {
      showToast('🔒 Unlock first to reset.');
      return;
    }
    if (!confirm('Delete ALL images? This cannot be undone.')) return;
    items = [];
    saveData();
    renderGrid();
    showToast('🗑️ All images cleared.');
  }

  // ================================================================
  // LOCK / UNLOCK
  // ================================================================
  function unlock() {
    const pass = passwordInput.value.trim();
    if (pass === OWNER_PASSWORD) {
      isUnlocked = true;
      lockStatus.textContent = '🔓 Unlocked';
      lockStatus.className = 'unlocked';
      lockToggleBtn.textContent = '🔒 Lock';
      lockToggleBtn.className = 'btn-lock';
      formPanel.classList.add('open');
      renderGrid();
      showToast('🔓 Unlocked! You can now edit.');
      passwordInput.value = '';
    } else {
      showToast('❌ Wrong password.');
      passwordInput.value = '';
    }
  }

  function lock() {
    isUnlocked = false;
    lockStatus.textContent = '🔒 Locked';
    lockStatus.className = 'locked';
    lockToggleBtn.textContent = '🔓 Unlock';
    lockToggleBtn.className = 'btn-unlock';
    formPanel.classList.remove('open');
    document.querySelectorAll('.edit-inline.open').forEach(el => el.classList.remove('open'));
    renderGrid();
    showToast('🔒 Locked. View only mode.');
  }

  // ================================================================
  // TOAST
  // ================================================================
  let toastTimer;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2800);
  }

  // ================================================================
  // EVENT LISTENERS
  // ================================================================
  lockToggleBtn.addEventListener('click', () => {
    if (isUnlocked) {
      lock();
    } else {
      unlock();
    }
  });

  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') unlock();
  });

  addBtn.addEventListener('click', () => {
    addItem(imageUrlInput.value, linkUrlInput.value);
  });

  imageUrlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      linkUrlInput.focus();
    }
  });

  linkUrlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addItem(imageUrlInput.value, linkUrlInput.value);
    }
  });

  resetBtn.addEventListener('click', resetAll);

  // ================================================================
  // INIT
  // ================================================================
  loadData();
  renderGrid();
  lock();

  console.log('[PrivateGrid] Ready. Uniform image size enabled.');
</script>
</body>
</html>
