<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlixLab – Netflix Style</title>
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b0b0b;
      color: #e0e0e0;
      padding: 0 20px 40px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===== HEADER (NETFLIX STYLE) ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0 14px;
      border-bottom: 1px solid #1a1a1a;
      flex-wrap: wrap;
      gap: 16px;
      position: sticky;
      top: 0;
      background: #0b0b0b;
      z-index: 100;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      color: #e50914;
      letter-spacing: -1px;
      text-transform: uppercase;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .logo span {
      color: #fff;
      font-weight: 300;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #aaa;
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      transition: 0.2s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-links a.active {
      color: #fff;
    }

    .search-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-box input {
      padding: 8px 16px;
      border: 1px solid #2a2a2a;
      border-radius: 60px;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: 0.25s;
      width: 180px;
    }

    .search-box input:focus {
      border-color: #e50914;
      width: 220px;
    }

    .search-box input::placeholder {
      color: #555;
    }

    .search-box button {
      padding: 8px 18px;
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-box button:hover {
      background: #b20710;
    }

    /* ===== HERO BANNER (NETFLIX HERO) ===== */
    .hero {
      margin: 24px 0 32px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: #141414;
      border: 1px solid #1e1e1e;
      min-height: 320px;
      display: flex;
      align-items: flex-end;
      padding: 40px 40px 30px;
      background-size: cover;
      background-position: center 20%;
      box-shadow: inset 0 -120px 80px -40px rgba(0, 0, 0, 0.9);
    }

    .hero-content {
      max-width: 500px;
      z-index: 2;
    }

    .hero-content .badge {
      display: inline-block;
      background: #e50914;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 60px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .hero-content h2 {
      font-size: 38px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .hero-content p {
      color: #ccc;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .hero-content .meta {
      display: flex;
      gap: 18px;
      font-size: 14px;
      color: #aaa;
    }

    .hero-content .meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hero-content .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .hero-content .btn-group button {
      padding: 10px 28px;
      border: none;
      border-radius: 60px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .hero-content .btn-group .play-btn {
      background: #fff;
      color: #0b0b0b;
    }

    .hero-content .btn-group .play-btn:hover {
      background: #e0e0e0;
    }

    .hero-content .btn-group .info-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      backdrop-filter: blur(6px);
    }

    .hero-content .btn-group .info-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ===== SECTION ROWS ===== */
    .section {
      margin-top: 32px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .section-header h3 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
    }

    .section-header a {
      color: #aaa;
      font-size: 14px;
      text-decoration: none;
    }

    .section-header a:hover {
      color: #fff;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }

    .movie-card {
      background: #141414;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #1e1e1e;
      transition: 0.25s;
      cursor: pointer;
    }

    .movie-card:hover {
      transform: scale(1.05);
      border-color: #e50914;
      box-shadow: 0 8px 30px rgba(229, 9, 20, 0.25);
      z-index: 10;
    }

    .movie-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      background: #1a1a1a;
    }

    .movie-card .info {
      padding: 12px 14px 16px;
    }

    .movie-card .info h4 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-card .info .meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #888;
    }

    .movie-card .info .rating {
      color: #f5c518;
      font-weight: 600;
    }

    /* ===== MODAL (NETFLIX STYLE DETAILS) ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #181818;
      max-width: 720px;
      width: 100%;
      border-radius: 24px;
      border: 1px solid #2a2a2a;
      overflow: hidden;
      position: relative;
      max-height: 92vh;
      overflow-y: auto;
      animation: fadeUp 0.3s ease;
    }

    .modal .modal-poster {
      width: 100%;
      max-height: 340px;
      object-fit: cover;
      background: #1a1a1a;
    }

    .modal .modal-body {
      padding: 24px 28px 32px;
    }

    .modal .close-btn {
      position: absolute;
      top: 14px;
      right: 18px;
      background: rgba(0, 0, 0, 0.7);
      border: none;
      color: #fff;
      font-size: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal .close-btn:hover {
      background: #e50914;
    }

    .modal h2 {
      font-size: 28px;
      color: #fff;
      margin-bottom: 4px;
    }

    .modal .tagline {
      color: #888;
      font-style: italic;
      margin-bottom: 12px;
    }

    .modal .overview {
      color: #ccc;
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 18px;
    }

    .modal .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 24px;
      font-size: 14px;
      color: #aaa;
      padding-top: 12px;
      border-top: 1px solid #2a2a2a;
    }

    .modal .details-grid .label {
      color: #666;
    }

    .modal .details-grid strong {
      color: #ddd;
    }

    .modal .btn-group {
      display: flex;
      gap: 12px;
      margin: 18px 0 8px;
    }

    .modal .btn-group button {
      padding: 10px 28px;
      border: none;
      border-radius: 60px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .modal .btn-group .play-btn {
      background: #e50914;
      color: #fff;
    }

    .modal .btn-group .play-btn:hover {
      background: #b20710;
    }

    /* ===== LOADING / EMPTY ===== */
    .loading,
    .empty {
      text-align: center;
      color: #666;
      padding: 60px 0;
      font-size: 18px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .search-box input {
        width: 100%;
      }
      .search-box input:focus {
        width: 100%;
      }
      .hero {
        padding: 30px 24px 24px;
        min-height: 220px;
      }
      .hero-content h2 {
        font-size: 26px;
      }
      .row {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }
      .movie-card img {
        height: 190px;
      }
      .modal .modal-body {
        padding: 16px 18px 24px;
      }
      .modal .details-grid {
        grid-template-columns: 1fr;
      }
      .nav-links {
        gap: 14px;
        font-size: 13px;
      }
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0b0b;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #444;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">Flix<span>Lab</span></div>
    <div class="nav-links">
      <a href="#" class="active">Home</a>
      <a href="#">TV Shows</a>
      <a href="#">Movies</a>
      <a href="#">New & Popular</a>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search titles..." />
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <!-- ===== HERO BANNER (auto-populated) ===== -->
  <div class="hero" id="heroBanner">
    <div class="hero-content">
      <div class="badge">Trending Now</div>
      <h2 id="heroTitle">Loading...</h2>
      <p id="heroDesc">Fetching the latest hit...</p>
      <div class="meta">
        <span id="heroRating">⭐ 0.0</span>
        <span id="heroYear">—</span>
      </div>
      <div class="btn-group">
        <button class="play-btn">▶ Play</button>
        <button class="info-btn">More Info</button>
      </div>
    </div>
  </div>

  <!-- ===== MOVIE ROWS ===== -->
  <div class="section">
    <div class="section-header">
      <h3>🔥 Popular Movies</h3>
      <a href="#">View All</a>
    </div>
    <div class="row" id="popularRow">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h3>⭐ Top Rated</h3>
      <a href="#">View All</a>
    </div>
    <div class="row" id="topRatedRow">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h3>🍿 Now Playing</h3>
      <a href="#">View All</a>
    </div>
    <div class="row" id="nowPlayingRow">
      <div class="loading">Loading...</div>
    </div>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" id="closeModalBtn">&times;</button>
    <img class="modal-poster" id="modalPoster" src="" alt="Poster" />
    <div class="modal-body">
      <h2 id="modalTitle">Title</h2>
      <div class="tagline" id="modalTagline"></div>
      <div class="overview" id="modalOverview"></div>
      <div class="btn-group">
        <button class="play-btn">▶ Play</button>
      </div>
      <div class="details-grid">
        <div><span class="label">⭐ Rating</span> <span id="modalRating">—</span></div>
        <div><span class="label">📅 Release</span> <span id="modalRelease">—</span></div>
        <div><span class="label">🎬 Genres</span> <span id="modalGenres">—</span></div>
        <div><span class="label">⏱ Runtime</span> <span id="modalRuntime">—</span></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ================================================================
  // CONFIGURATION – GET YOUR FREE TMDB API KEY
  // ================================================================
  const TMDB_API_KEY = 'YOUR_TMDB_API_KEY'; // ← PALITAN ITO (get at themoviedb.org)
  const BASE_IMAGE = 'https://image.tmdb.org/t/p/w500';
  const BACKDROP_IMAGE = 'https://image.tmdb.org/t/p/original';

  // ================================================================
  // STATE
  // ================================================================
  let currentHeroId = null;

  // ================================================================
  // DOM REFS
  // ================================================================
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');

  const heroBanner = document.getElementById('heroBanner');
  const heroTitle = document.getElementById('heroTitle');
  const heroDesc = document.getElementById('heroDesc');
  const heroRating = document.getElementById('heroRating');
  const heroYear = document.getElementById('heroYear');

  const popularRow = document.getElementById('popularRow');
  const topRatedRow = document.getElementById('topRatedRow');
  const nowPlayingRow = document.getElementById('nowPlayingRow');

  // Modal
  const modalOverlay = document.getElementById('modalOverlay');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const modalPoster = document.getElementById('modalPoster');
  const modalTitle = document.getElementById('modalTitle');
  const modalTagline = document.getElementById('modalTagline');
  const modalOverview = document.getElementById('modalOverview');
  const modalRating = document.getElementById('modalRating');
  const modalRelease = document.getElementById('modalRelease');
  const modalGenres = document.getElementById('modalGenres');
  const modalRuntime = document.getElementById('modalRuntime');

  // ================================================================
  // FETCH MOVIES
  // ================================================================
  async function fetchMovies(endpoint, targetRow, limit = 12) {
    try {
      const res = await fetch(
        `https://api.themoviedb.org/3/movie/${endpoint}?api_key=${TMDB_API_KEY}&language=en-US&page=1`
      );
      const data = await res.json();
      const movies = data.results?.slice(0, limit) || [];
      renderMovies(movies, targetRow);
      return movies;
    } catch (err) {
      targetRow.innerHTML = `<div class="empty">⚠️ Error loading movies. Check API key.</div>`;
      console.error(err);
      return [];
    }
  }

  // ================================================================
  // RENDER MOVIES (grid)
  // ================================================================
  function renderMovies(movies, container) {
    if (!movies || movies.length === 0) {
      container.innerHTML = `<div class="empty">No movies found.</div>`;
      return;
    }

    container.innerHTML = movies.map(m => {
      const poster = m.poster_path
        ? `${BASE_IMAGE}${m.poster_path}`
        : 'https://via.placeholder.com/500x750/1a1a1a/444?text=No+Poster';
      const rating = m.vote_average ? m.vote_average.toFixed(1) : '—';
      const year = m.release_date ? m.release_date.slice(0, 4) : '—';
      return `
        <div class="movie-card" data-id="${m.id}">
          <img src="${poster}" alt="${m.title}" loading="lazy" />
          <div class="info">
            <h4>${m.title}</h4>
            <div class="meta">
              <span>${year}</span>
              <span class="rating">⭐ ${rating}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // Click to open modal
    container.querySelectorAll('.movie-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.dataset.id;
        openModal(id);
      });
    });
  }

  // ================================================================
  // SET HERO (using the first movie from popular list)
  // ================================================================
  function setHero(movie) {
    if (!movie) return;
    currentHeroId = movie.id;
    heroTitle.textContent = movie.title || 'Untitled';
    heroDesc.textContent = movie.overview || 'No description available.';
    heroRating.textContent = `⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : '—'}`;
    heroYear.textContent = movie.release_date ? movie.release_date.slice(0, 4) : '—';

    const backdrop = movie.backdrop_path
      ? `${BACKDROP_IMAGE}${movie.backdrop_path}`
      : movie.poster_path
      ? `${BASE_IMAGE}${movie.poster_path}`
      : null;

    if (backdrop) {
      heroBanner.style.backgroundImage = `url(${backdrop})`;
      heroBanner.style.backgroundSize = 'cover';
      heroBanner.style.backgroundPosition = 'center 20%';
    } else {
      heroBanner.style.background = '#141414';
    }

    // Hero card click to open modal
    heroBanner.onclick = (e) => {
      // Don't trigger if clicking buttons
      if (e.target.closest('button')) return;
      openModal(movie.id);
    };
  }

  // ================================================================
  // SEARCH
  // ================================================================
  async function searchMovies(query) {
    if (!query.trim()) {
      // Reload default rows
      loadAll();
      return;
    }

    try {
      const res = await fetch(
        `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&page=1`
      );
      const data = await res.json();
      const results = data.results || [];

      // Show search results in all rows (or just popular row)
      popularRow.innerHTML = `<div class="section-header" style="grid-column:1/-1; margin-bottom:8px;">
        <h3 style="color:#fff;">🔍 Results for "${query}"</h3>
      </div>`;
      renderMovies(results, popularRow);
      topRatedRow.innerHTML = '';
      nowPlayingRow.innerHTML = '';

      // Set hero to first result
      if (results.length > 0) {
        setHero(results[0]);
      } else {
        heroTitle.textContent = 'No results found';
        heroDesc.textContent = 'Try a different search term.';
      }
    } catch (err) {
      console.error(err);
    }
  }

  // ================================================================
  // LOAD ALL DEFAULT ROWS
  // ================================================================
  async function loadAll() {
    const popular = await fetchMovies('popular', popularRow, 12);
    await fetchMovies('top_rated', topRatedRow, 12);
    await fetchMovies('now_playing', nowPlayingRow, 12);

    if (popular.length > 0) {
      setHero(popular[0]);
    }
  }

  // ================================================================
  // MODAL
  // ================================================================
  async function openModal(movieId) {
    try {
      const res = await fetch(
        `https://api.themoviedb.org/3/movie/${movieId}?api_key=${TMDB_API_KEY}&append_to_response=credits`
      );
      const m = await res.json();

      modalPoster.src = m.poster_path
        ? `${BASE_IMAGE}${m.poster_path}`
        : 'https://via.placeholder.com/500x750/1a1a1a/444?text=No+Poster';
      modalTitle.textContent = m.title || 'Untitled';
      modalTagline.textContent = m.tagline || '';
      modalOverview.textContent = m.overview || 'No overview available.';
      modalRating.textContent = m.vote_average ? m.vote_average.toFixed(1) + ' / 10' : '—';
      modalRelease.textContent = m.release_date || '—';
      modalGenres.textContent = m.genres ? m.genres.map(g => g.name).join(', ') : '—';
      modalRuntime.textContent = m.runtime ? m.runtime + ' min' : '—';

      modalOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    } catch (err) {
      console.error(err);
      alert('Error loading movie details.');
    }
  }

  function closeModal() {
    modalOverlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  // ================================================================
  // EVENT LISTENERS
  // ================================================================
  searchBtn.addEventListener('click', () => {
    searchMovies(searchInput.value);
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      searchMovies(searchInput.value);
    }
  });

  closeModalBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // ================================================================
  // INIT
  // ================================================================
  if (TMDB_API_KEY === 'YOUR_TMDB_API_KEY') {
    popularRow.innerHTML = `
      <div class="empty" style="padding:40px; background:#141414; border-radius:16px; border:1px solid #2a2a2a; grid-column:1/-1;">
        <p style="font-size:18px; margin-bottom:8px;">🔑 Kailangan mo ng TMDB API key</p>
        <p style="font-size:14px; color:#666;">
          Pumunta sa <a href="https://www.themoviedb.org/signup" target="_blank" style="color:#e50914;">themoviedb.org</a>,
          gumawa ng account, at kumuha ng API key. <br />
          Pagkatapos, palitan ang <code style="background:#222; padding:2px 8px; border-radius:4px;">TMDB_API_KEY</code> sa script.
        </p>
      </div>
    `;
    topRatedRow.innerHTML = '';
    nowPlayingRow.innerHTML = '';
    heroTitle.textContent = 'API Key Required';
    heroDesc.textContent = 'Please add your TMDB API key to the script.';
  } else {
    loadAll();
  }

  console.log('[FlixLab] Netflix-style movie browser ready.');
</script>
</body>
</html>
