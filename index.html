<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EarnShort – PTE Shortener</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0b0b;
      color: #e0e0e0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: #141414;
      padding: 36px 28px;
      border-radius: 28px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      text-align: center;
    }
    .logo span {
      color: #f5b342;
    }

    .sub {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin: 4px 0 28px;
    }

    .balance-box {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 18px 22px;
      border: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .balance-box .label {
      color: #888;
      font-size: 14px;
    }
    .balance-box .amount {
      font-size: 28px;
      font-weight: 700;
      color: #f5b342;
    }
    .balance-box .amount span {
      font-size: 16px;
      color: #888;
      font-weight: 400;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .input-row input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #2a2a2a;
      border-radius: 60px;
      background: #1a1a1a;
      color: #fff;
      font-size: 15px;
      outline: none;
      min-width: 180px;
    }

    .input-row input:focus {
      border-color: #f5b342;
    }

    .input-row button {
      padding: 14px 28px;
      background: #f5b342;
      color: #0b0b0b;
      border: none;
      border-radius: 60px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: #e6a33a;
      transform: scale(1.02);
    }

    .stats-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      background: #111;
      border-radius: 16px;
      padding: 16px 20px;
      border: 1px solid #222;
      margin: 16px 0 20px;
    }

    .stats-row .stat {
      flex: 1;
      text-align: center;
      min-width: 80px;
    }
    .stats-row .stat .num {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }
    .stats-row .stat .lbl {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .link-list {
      margin-top: 20px;
      max-height: 260px;
      overflow-y: auto;
    }

    .link-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #111;
      border-radius: 12px;
      border: 1px solid #222;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .link-item .short {
      color: #f5b342;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .link-item .short:hover {
      text-decoration: underline;
    }

    .link-item .original {
      color: #888;
      font-size: 13px;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-item .earnings {
      color: #4caf50;
      font-size: 14px;
      font-weight: 600;
    }

    .link-item .delete-btn {
      background: #ff4444;
      color: #fff;
      border: none;
      padding: 4px 14px;
      border-radius: 60px;
      cursor: pointer;
      font-size: 12px;
    }

    .link-item .delete-btn:hover {
      background: #cc0000;
    }

    .empty-msg {
      color: #555;
      text-align: center;
      padding: 30px 0;
    }

    .footer {
      text-align: center;
      color: #444;
      font-size: 12px;
      margin-top: 24px;
    }

    .copy-notif {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #f5b342;
      color: #0b0b0b;
      padding: 10px 28px;
      border-radius: 60px;
      font-weight: 600;
      opacity: 0;
      transition: 0.3s;
      pointer-events: none;
    }

    .copy-notif.show {
      opacity: 1;
    }

    /* ===== AD SIMULATION OVERLAY ===== */
    .ad-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      flex-direction: column;
      padding: 20px;
    }

    .ad-overlay.active {
      display: flex;
    }

    .ad-box {
      background: #1a1a1a;
      max-width: 500px;
      width: 100%;
      padding: 32px 24px;
      border-radius: 24px;
      border: 1px solid #2a2a2a;
      text-align: center;
    }

    .ad-box .ad-label {
      color: #666;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .ad-box .ad-content {
      background: #111;
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
      border: 1px solid #2a2a2a;
      color: #aaa;
      font-size: 15px;
    }

    .ad-box .ad-timer {
      font-size: 42px;
      font-weight: 700;
      color: #f5b342;
      margin: 8px 0;
    }

    .ad-box .ad-btn {
      background: #f5b342;
      color: #0b0b0b;
      border: none;
      padding: 12px 32px;
      border-radius: 60px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      opacity: 0.4;
      pointer-events: none;
      transition: 0.3s;
    }

    .ad-box .ad-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .ad-box .ad-btn:hover {
      background: #e6a33a;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="logo">Earn<span>Short</span></div>
  <p class="sub">Shorten links &amp; earn per click</p>

  <!-- BALANCE -->
  <div class="balance-box">
    <span class="label">💰 Your Balance</span>
    <span class="amount"><span>$</span><span id="balanceDisplay">0.00</span></span>
  </div>

  <!-- INPUT -->
  <div class="input-row">
    <input type="url" id="urlInput" placeholder="https://example.com/long-url" value="https://www.google.com" />
    <button id="shortenBtn">Shorten &amp; Earn</button>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat">
      <div class="num" id="totalLinks">0</div>
      <div class="lbl">Links</div>
    </div>
    <div class="stat">
      <div class="num" id="totalClicks">0</div>
      <div class="lbl">Clicks</div>
    </div>
    <div class="stat">
      <div class="num" id="totalEarnings">$0.00</div>
      <div class="lbl">Earned</div>
    </div>
  </div>

  <!-- LINK LIST -->
  <div id="linkList" class="link-list">
    <div class="empty-msg">No links yet. Shorten one to start earning!</div>
  </div>

  <div class="footer">💡 Each click earns ~$0.002 – $0.005 (simulated)</div>
</div>

<!-- ===== AD SIMULATION OVERLAY ===== -->
<div class="ad-overlay" id="adOverlay">
  <div class="ad-box">
    <div class="ad-label">Sponsored Content</div>
    <div class="ad-content">
      <p style="font-size:18px; color:#fff; margin-bottom:6px;">📺 Watch this ad to continue</p>
      <p style="font-size:14px; color:#666;">You earn <strong style="color:#f5b342;">$0.003</strong> per view</p>
    </div>
    <div class="ad-timer" id="adTimer">5</div>
    <button class="ad-btn" id="adContinueBtn">Continue to Link</button>
  </div>
</div>

<!-- COPY NOTIFICATION -->
<div class="copy-notif" id="copyNotif">✅ Copied!</div>

<script>
  // ================================================================
  // CONFIG
  // ================================================================
  const BASE_URL = window.location.origin + window.location.pathname.replace(/\/$/, '') + '?r=';
  const EARN_PER_CLICK = 0.003; // simulated $ per click

  // ================================================================
  // DATA STORE (localStorage)
  // ================================================================
  function getLinks() {
    try {
      return JSON.parse(localStorage.getItem('pteLinks')) || {};
    } catch {
      return {};
    }
  }

  function saveLinks(links) {
    localStorage.setItem('pteLinks', JSON.stringify(links));
  }

  function getClicks() {
    try {
      return JSON.parse(localStorage.getItem('pteClicks')) || {};
    } catch {
      return {};
    }
  }

  function saveClicks(clicks) {
    localStorage.setItem('pteClicks', JSON.stringify(clicks));
  }

  function getBalance() {
    try {
      return parseFloat(localStorage.getItem('pteBalance')) || 0;
    } catch {
      return 0;
    }
  }

  function setBalance(val) {
    localStorage.setItem('pteBalance', String(val));
  }

  // ================================================================
  // GENERATE SHORT CODE
  // ================================================================
  function generateCode(length = 6) {
    const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let code = '';
    for (let i = 0; i < length; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return code;
  }

  function uniqueCode(links) {
    let code;
    let attempts = 0;
    do {
      code = generateCode(6);
      attempts++;
    } while (links[code] && attempts < 100);
    return code;
  }

  // ================================================================
  // SHORTEN LINK
  // ================================================================
  function shortenLink() {
    const input = document.getElementById('urlInput');
    let url = input.value.trim();
    if (!url) {
      alert('Please enter a URL.');
      return;
    }
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      url = 'https://' + url;
    }

    const links = getLinks();
    const code = uniqueCode(links);
    links[code] = url;
    saveLinks(links);

    // Show the short link
    const shortUrl = BASE_URL + code;
    alert('✅ Short link created!\n' + shortUrl + '\n\nShare this link. Each click earns you ~$0.003');

    input.value = '';
    updateUI();
  }

  // ================================================================
  // HANDLE REDIRECT + AD + EARN
  // ================================================================
  function handleRedirect() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('r');
    if (!code) return false;

    const links = getLinks();
    if (!links[code]) {
      document.body.innerHTML = `<div style="text-align:center;padding:80px 20px;color:#888;"><h2>❌ Link not found</h2><p>The short code <code>${code}</code> does not exist.</p></div>`;
      return true;
    }

    // Show ad overlay before redirecting
    showAdOverlay(code);
    return true;
  }

  // ================================================================
  // AD OVERLAY
  // ================================================================
  let adCode = null;
  let adTimerInterval = null;

  function showAdOverlay(code) {
    adCode = code;
    const overlay = document.getElementById('adOverlay');
    const timerDisplay = document.getElementById('adTimer');
    const btn = document.getElementById('adContinueBtn');

    overlay.classList.add('active');
    let countdown = 5;
    timerDisplay.textContent = countdown;
    btn.classList.remove('active');
    btn.textContent = '⏳ Please wait...';

    clearInterval(adTimerInterval);
    adTimerInterval = setInterval(() => {
      countdown -= 1;
      timerDisplay.textContent = countdown;
      if (countdown <= 0) {
        clearInterval(adTimerInterval);
        timerDisplay.textContent = '0';
        btn.classList.add('active');
        btn.textContent = '🚀 Continue to Link';
      }
    }, 1000);

    // One-time click handler
    btn.onclick = function() {
      if (!this.classList.contains('active')) return;
      // Add earnings
      const clicks = getClicks();
      clicks[code] = (clicks[code] || 0) + 1;
      saveClicks(clicks);

      const balance = getBalance();
      setBalance(balance + EARN_PER_CLICK);

      overlay.classList.remove('active');
      clearInterval(adTimerInterval);

      // Redirect to original URL
      const links = getLinks();
      window.location.href = links[code];
    };
  }

  // ================================================================
  // UI UPDATE
  // ================================================================
  function updateUI() {
    const links = getLinks();
    const clicks = getClicks();
    const balance = getBalance();

    const totalLinks = Object.keys(links).length;
    const totalClicks = Object.values(clicks).reduce((a, b) => a + b, 0);

    document.getElementById('totalLinks').textContent = totalLinks;
    document.getElementById('totalClicks').textContent = totalClicks;
    document.getElementById('totalEarnings').textContent = '$' + balance.toFixed(4);
    document.getElementById('balanceDisplay').textContent = balance.toFixed(4);

    renderLinkList();
  }

  // ================================================================
  // RENDER LINK LIST
  // ================================================================
  function renderLinkList() {
    const links = getLinks();
    const clicks = getClicks();
    const list = document.getElementById('linkList');
    const entries = Object.entries(links);

    if (entries.length === 0) {
      list.innerHTML = '<div class="empty-msg">No links yet. Shorten one to start earning!</div>';
      return;
    }

    list.innerHTML = entries.map(([code, url]) => {
      const clickCount = clicks[code] || 0;
      const earned = (clickCount * EARN_PER_CLICK).toFixed(4);
      return `
        <div class="link-item">
          <span class="short" data-code="${code}">${BASE_URL}${code}</span>
          <span class="original" title="${url}">${url.length > 40 ? url.slice(0, 40) + '…' : url}</span>
          <span class="earnings">+$${earned}</span>
          <button class="delete-btn" data-code="${code}">Delete</button>
        </div>
      `;
    }).join('');

    // Copy short link on click
    list.querySelectorAll('.short').forEach(el => {
      el.addEventListener('click', () => {
        const text = el.textContent;
        navigator.clipboard.writeText(text).then(() => {
          const notif = document.getElementById('copyNotif');
          notif.classList.add('show');
          setTimeout(() => notif.classList.remove('show'), 2000);
        }).catch(() => {
          alert('Copy: ' + text);
        });
      });
    });

    // Delete link
    list.querySelectorAll('.delete-btn').forEach(el => {
      el.addEventListener('click', () => {
        const code = el.dataset.code;
        if (confirm('Delete this link?')) {
          const links = getLinks();
          const clicks = getClicks();
          delete links[code];
          delete clicks[code];
          saveLinks(links);
          saveClicks(clicks);
          updateUI();
        }
      });
    });
  }

  // ================================================================
  // EVENT LISTENERS
  // ================================================================
  document.getElementById('shortenBtn').addEventListener('click', shortenLink);
  document.getElementById('urlInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') shortenLink();
  });

  // ================================================================
  // INIT
  // ================================================================
  // Check if we're redirecting
  if (!handleRedirect()) {
    updateUI();
  }

  console.log('[EarnShort] Pay-to-earn shortener mockup ready.');
  console.log('[EarnShort] Base URL:', BASE_URL);
</script>
</body>
  </html>
