<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Gallery – Private</title>
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      padding: 30px 20px 60px;
      min-height: 100vh;
      background-image: radial-gradient(circle at 20% 30%, rgba(108, 92, 231, 0.05) 0%, transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(0, 206, 201, 0.04) 0%, transparent 60%);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 16px;
    }

    .header-left h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f0f0f5 0%, #a0a0b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-left p {
      color: #666;
      font-size: 14px;
      margin-top: 2px;
      letter-spacing: 0.3px;
    }

    .lock-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 16px 8px 20px;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .lock-bar .status {
      font-size: 13px;
      color: #888;
    }

    .lock-bar .status .locked {
      color: #ff6b6b;
    }

    .lock-bar .status .unlocked {
      color: #4a9eff;
    }

    .lock-bar input {
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      font-size: 13px;
      outline: none;
      width: 140px;
      transition: 0.2s;
    }

    .lock-bar input:focus {
      border-color: #4a9eff;
      background: rgba(255, 255, 255, 0.06);
    }

    .lock-bar button {
      padding: 6px 18px;
      border: none;
      border-radius: 60px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-unlock {
      background: #4a9eff;
      color: #fff;
    }

    .btn-unlock:hover {
      background: #3a8aee;
      transform: scale(1.02);
    }

    .btn-lock {
      background: #ff6b6b;
      color: #fff;
    }

    .btn-lock:hover {
      background: #e55555;
      transform: scale(1.02);
    }

    /* ===== FORM (cinematic panel) ===== */
    .form-panel {
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 24px 28px;
      margin-bottom: 36px;
      display: none;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .form-panel.open {
      display: block;
    }

    .form-panel h3 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    .form-group input:focus {
      border-color: #4a9eff;
      background: rgba(0, 0, 0, 0.6);
    }

    .form-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4a9eff, #6c5ce7);
      color: #fff;
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 30px rgba(74, 158, 255, 0.3);
    }

    .btn-danger {
      background: #ff6b6b;
      color: #fff;
    }

    .btn-danger:hover {
      background: #e55555;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #ddd;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* ===== MOVIE GRID ===== */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      margin-top: 10px;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
    }

    @media (max-width: 400px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    /* ===== MOVIE CARD ===== */
    .movie-card {
      background: rgba(16, 16, 24, 0.7);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      overflow: hidden;
      transition: 0.35s cubic-bezier(0.2, 0, 0, 1);
      position: relative;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .movie-card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: rgba(74, 158, 255, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(74, 158, 255, 0.05);
    }

    .movie-card a {
      display: block;
      text-decoration: none;
    }

    /* ===== POSTER (cinematic crop) ===== */
    .movie-card .poster {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      background: #0a0a0f;
      transition: 0.4s;
    }

    .movie-card:hover .poster {
      transform: scale(1.02);
    }

    @media (max-width: 640px) {
      .movie-card .poster {
        height: 200px;
      }
    }

    @media (max-width: 400px) {
      .movie-card .poster {
        height: 260px;
      }
    }

    /* ===== CARD FOOTER ===== */
    .movie-card .info {
      padding: 16px 18px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }

    .movie-card .info .title {
      color: #ccc;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
      letter-spacing: 0.2px;
    }

    .movie-card .info .title a {
      color: #ccc;
      text-decoration: none;
    }

    .movie-card .info .title a:hover {
      color: #fff;
    }

    .movie-card .info .actions {
      display: flex;
      gap: 6px;
    }

    .movie-card .info .actions button {
      background: transparent;
      border: none;
      color: #555;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      padding: 4px 6px;
      border-radius: 6px;
    }

    .movie-card .info .actions button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    .movie-card .info .actions .edit-btn:hover {
      color: #4a9eff;
    }

    .movie-card .info .actions .delete-btn:hover {
      color: #ff6b6b;
    }

    /* ===== HIDE EDIT CONTROLS WHEN LOCKED ===== */
    .movie-card .info .actions.hidden-actions {
      display: none !important;
    }

    /* ===== EDIT INLINE (cinematic) ===== */
    .edit-inline {
      padding: 16px 18px 18px;
      background: rgba(0, 0, 0, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      display: none;
    }

    .edit-inline.open {
      display: block;
    }

    .edit-inline .form-group {
      margin-bottom: 10px;
    }

    .edit-inline .form-group label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .edit-inline .form-group input {
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 10px;
    }

    .edit-inline .edit-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .edit-inline .edit-actions button {
      padding: 6px 18px;
      border: none;
      border-radius: 60px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .edit-inline .edit-actions .save-edit {
      background: #4a9eff;
      color: #fff;
    }

    .edit-inline .edit-actions .save-edit:hover {
      background: #3a8aee;
    }

    .edit-inline .edit-actions .cancel-edit {
      background: rgba(255, 255, 255, 0.06);
      color: #ddd;
    }

    .edit-inline .edit-actions .cancel-edit:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #555;
      font-size: 18px;
    }

    .empty-state span {
      font-size: 56px;
      display: block;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 30, 0.9);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 12px 28px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: 0.4s;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ===== HEADER ===== -->
  <div class="header">
    <div class="header-left">
      <h1>🎬 Movie Gallery</h1>
      <p>2 per row · click poster to visit link</p>
    </div>
    <div class="lock-bar">
      <span class="status">Status: <span id="lockStatus" class="locked">🔒 Locked</span></span>
      <input type="password" id="passwordInput" placeholder="Password" />
      <button id="lockToggleBtn" class="btn-unlock">🔓 Unlock</button>
    </div>
  </div>

  <!-- ===== FORM ===== -->
  <div class="form-panel" id="formPanel">
    <h3>➕ Add New Movie Poster</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Image URL</label>
        <input type="url" id="imageUrlInput" placeholder="https://example.com/poster.jpg" />
      </div>
      <div class="form-group">
        <label>Link URL (destination)</label>
        <input type="url" id="linkUrlInput" placeholder="https://example.com" />
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="addBtn">➕ Add Poster</button>
      <button class="btn btn-secondary" id="resetBtn">🗑️ Reset All</button>
    </div>
  </div>

  <!-- ===== GRID ===== -->
  <div class="grid" id="gridContainer">
    <div class="empty-state">
      <span>🎞️</span>
      No posters yet.<br />Add your first movie poster above.
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
  // ================================================================
  // CONFIG – CHANGE YOUR PASSWORD HERE
  // ================================================================
  const OWNER_PASSWORD = 'admin123'; // ← palitan kung gusto mo

  // ================================================================
  // STATE
  // ================================================================
  let items = [];
  let isUnlocked = false;

  // ================================================================
  // DOM REFS
  // ================================================================
  const grid = document.getElementById('gridContainer');
  const imageUrlInput = document.getElementById('imageUrlInput');
  const linkUrlInput = document.getElementById('linkUrlInput');
  const addBtn = document.getElementById('addBtn');
  const resetBtn = document.getElementById('resetBtn');
  const toast = document.getElementById('toast');
  const passwordInput = document.getElementById('passwordInput');
  const lockToggleBtn = document.getElementById('lockToggleBtn');
  const lockStatus = document.getElementById('lockStatus');
  const formPanel = document.getElementById('formPanel');

  // ================================================================
  // STORAGE
  // ================================================================
  function loadData() {
    try {
      const raw = localStorage.getItem('movieGalleryItems');
      if (raw) {
        items = JSON.parse(raw);
        if (!Array.isArray(items)) items = [];
      } else {
        items = [
          { id: Date.now() + 1, image: 'https://picsum.photos/seed/1/600/400', link: 'https://example.com/1' },
          { id: Date.now() + 2, image: 'https://picsum.photos/seed/2/600/400', link: 'https://example.com/2' },
          { id: Date.now() + 3, image: 'https://picsum.photos/seed/3/600/400', link: 'https://example.com/3' },
          { id: Date.now() + 4, image: 'https://picsum.photos/seed/4/600/400', link: 'https://example.com/4' }
        ];
        saveData();
      }
    } catch {
      items = [];
    }
  }

  function saveData() {
    localStorage.setItem('movieGalleryItems', JSON.stringify(items));
  }

  // ================================================================
  // RENDER
  // ================================================================
  function renderGrid() {
    if (!items || items.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <span>🎞️</span>
          No posters yet.<br />Add your first movie poster above.
        </div>
      `;
      return;
    }

    grid.innerHTML = items.map((item, index) => {
      const actionClass = isUnlocked ? '' : 'hidden-actions';
      const editClass = isUnlocked ? '' : 'hidden-edit';
      return `
        <div class="movie-card" data-index="${index}">
          <a href="${item.link || '#'}" target="_blank" rel="noopener">
            <img class="poster" src="${item.image || 'https://via.placeholder.com/600x400/1a1a1a/444?text=No+Poster'}" alt="Poster ${index + 1}" loading="lazy" />
          </a>
          <div class="info">
            <span class="title" title="${item.link || ''}">${item.link ? item.link.slice(0, 40) + (item.link.length > 40 ? '…' : '') : 'No link'}</span>
            <div class="actions ${actionClass}">
              <button class="edit-btn" data-index="${index}" title="Edit">✏️</button>
              <button class="delete-btn" data-index="${index}" title="Delete">🗑️</button>
            </div>
          </div>
          <div class="edit-inline ${editClass}" id="edit-${index}">
            <div class="form-group">
              <label>Image URL</label>
              <input type="url" class="edit-image-input" value="${item.image || ''}" />
            </div>
            <div class="form-group">
              <label>Link URL</label>
              <input type="url" class="edit-link-input" value="${item.link || ''}" />
            </div>
            <div class="edit-actions">
              <button class="save-edit" data-index="${index}">💾 Save</button>
              <button class="cancel-edit" data-index="${index}">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    if (isUnlocked) {
      grid.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.index);
          deleteItem(idx);
        });
      });

      grid.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.index);
          toggleEdit(idx, true);
        });
      });

      grid.querySelectorAll('.save-edit').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.index);
          saveEdit(idx);
        });
      });

      grid.querySelectorAll('.cancel-edit').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.index);
          toggleEdit(idx, false);
        });
      });
    }
  }

  // ================================================================
  // CRUD
  // ================================================================
  function addItem(image, link) {
    if (!isUnlocked) { showToast('🔒 Unlock first to add.'); return false; }
    if (!image.trim()) { showToast('⚠️ Enter an image URL.'); return false; }
    items.push({ id: Date.now(), image: image.trim(), link: link.trim() || '#' });
    saveData();
    renderGrid();
    showToast('✅ Poster added!');
    imageUrlInput.value = '';
    linkUrlInput.value = '';
    return true;
  }

  function deleteItem(index) {
    if (!isUnlocked) { showToast('🔒 Unlock first to delete.'); return; }
    if (!confirm('Delete this poster?')) return;
    items.splice(index, 1);
    saveData();
    renderGrid();
    showToast('🗑️ Poster deleted.');
  }

  function saveEdit(index) {
    if (!isUnlocked) { showToast('🔒 Unlock first to edit.'); return; }
    const card = grid.querySelector(`.movie-card[data-index="${index}"]`);
    if (!card) return;
    const imgInput = card.querySelector('.edit-image-input');
    const linkInput = card.querySelector('.edit-link-input');
    const newImage = imgInput.value.trim();
    const newLink = linkInput.value.trim();
    if (!newImage) { showToast('⚠️ Image URL cannot be empty.'); return; }
    items[index].image = newImage;
    items[index].link = newLink || '#';
    saveData();
    renderGrid();
    showToast('✅ Updated!');
  }

  function toggleEdit(index, show) {
    if (!isUnlocked) { showToast('🔒 Unlock first to edit.'); return; }
    const card = grid.querySelector(`.movie-card[data-index="${index}"]`);
    if (!card) return;
    const panel = card.querySelector('.edit-inline');
    if (panel) {
      panel.classList.toggle('open', show);
      if (show) {
        panel.querySelector('.edit-image-input').value = items[index].image || '';
        panel.querySelector('.edit-link-input').value = items[index].link || '';
      }
    }
  }

  function resetAll() {
    if (!isUnlocked) { showToast('🔒 Unlock first to reset.'); return; }
    if (!confirm('Delete ALL posters?')) return;
    items = [];
    saveData();
    renderGrid();
    showToast('🗑️ All cleared.');
  }

  // ================================================================
  // LOCK / UNLOCK
  // ================================================================
  function unlock() {
    if (passwordInput.value.trim() === OWNER_PASSWORD) {
      isUnlocked = true;
      lockStatus.textContent = '🔓 Unlocked';
      lockStatus.className = 'unlocked';
      lockToggleBtn.textContent = '🔒 Lock';
      lockToggleBtn.className = 'btn-lock';
      formPanel.classList.add('open');
      renderGrid();
      showToast('🔓 Unlocked! You can now edit.');
      passwordInput.value = '';
    } else {
      showToast('❌ Wrong password.');
      passwordInput.value = '';
    }
  }

  function lock() {
    isUnlocked = false;
    lockStatus.textContent = '🔒 Locked';
    lockStatus.className = 'locked';
    lockToggleBtn.textContent = '🔓 Unlock';
    lockToggleBtn.className = 'btn-unlock';
    formPanel.classList.remove('open');
    document.querySelectorAll('.edit-inline.open').forEach(el => el.classList.remove('open'));
    renderGrid();
    showToast('🔒 Locked. View only.');
  }

  // ================================================================
  // TOAST
  // ================================================================
  let toastTimer;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
  }

  // ================================================================
  // EVENTS
  // ================================================================
  lockToggleBtn.addEventListener('click', () => isUnlocked ? lock() : unlock());
  passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
  addBtn.addEventListener('click', () => addItem(imageUrlInput.value, linkUrlInput.value));
  imageUrlInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
      linkUrlInput.focus(); } });
  linkUrlInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
      addItem(imageUrlInput.value, linkUrlInput.value); } });
  resetBtn.addEventListener('click', resetAll);

  // ================================================================
  // INIT
  // ================================================================
  loadData();
  renderGrid();
  lock();
  console.log('[MovieGallery] Ready. Password protected.');
</script>
</body>
</html>
