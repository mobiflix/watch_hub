<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlixLab – Watch Movies</title>
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b0b0b;
      color: #e0e0e0;
      padding: 0 20px 40px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0 14px;
      border-bottom: 1px solid #1a1a1a;
      flex-wrap: wrap;
      gap: 16px;
      position: sticky;
      top: 0;
      background: #0b0b0b;
      z-index: 100;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      color: #e50914;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .logo span {
      color: #fff;
      font-weight: 300;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #aaa;
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      transition: 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #fff;
    }

    .search-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-box input {
      padding: 8px 16px;
      border: 1px solid #2a2a2a;
      border-radius: 60px;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: 0.25s;
      width: 180px;
    }

    .search-box input:focus {
      border-color: #e50914;
      width: 220px;
    }

    .search-box input::placeholder {
      color: #555;
    }

    .search-box button {
      padding: 8px 18px;
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-box button:hover {
      background: #b20710;
    }

    /* ===== HERO BANNER ===== */
    .hero {
      margin: 24px 0 32px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: #141414;
      border: 1px solid #1e1e1e;
      min-height: 320px;
      display: flex;
      align-items: flex-end;
      padding: 40px 40px 30px;
      background-size: cover;
      background-position: center 20%;
      box-shadow: inset 0 -120px 80px -40px rgba(0, 0, 0, 0.9);
      cursor: pointer;
    }

    .hero-content {
      max-width: 520px;
      z-index: 2;
    }

    .hero-content .badge {
      display: inline-block;
      background: #e50914;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 60px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .hero-content h2 {
      font-size: 38px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .hero-content p {
      color: #ccc;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .hero-content .meta {
      display: flex;
      gap: 18px;
      font-size: 14px;
      color: #aaa;
    }

    .hero-content .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .hero-content .btn-group button {
      padding: 10px 28px;
      border: none;
      border-radius: 60px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .hero-content .btn-group .play-btn {
      background: #fff;
      color: #0b0b0b;
    }

    .hero-content .btn-group .play-btn:hover {
      background: #e0e0e0;
    }

    .hero-content .btn-group .info-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      backdrop-filter: blur(6px);
    }

    .hero-content .btn-group .info-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ===== SECTIONS ===== */
    .section {
      margin-top: 32px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .section-header h3 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }

    .movie-card {
      background: #141414;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #1e1e1e;
      transition: 0.25s;
      cursor: pointer;
    }

    .movie-card:hover {
      transform: scale(1.05);
      border-color: #e50914;
      box-shadow: 0 8px 30px rgba(229, 9, 20, 0.25);
      z-index: 10;
    }

    .movie-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      background: #1a1a1a;
    }

    .movie-card .info {
      padding: 12px 14px 16px;
    }

    .movie-card .info h4 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-card .info .meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #888;
    }

    .movie-card .info .rating {
      color: #f5c518;
      font-weight: 600;
    }

    /* ===== VIDEO PLAYER OVERLAY ===== */
    .player-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 999;
      flex-direction: column;
    }

    .player-overlay.active {
      display: flex;
    }

    .player-box {
      width: 100%;
      max-width: 960px;
      background: #0d0d0d;
      border-radius: 20px;
      border: 1px solid #2a2a2a;
      overflow: hidden;
      position: relative;
      padding: 16px 16px 20px;
    }

    .player-box .close-btn {
      position: absolute;
      top: 8px;
      right: 16px;
      background: rgba(0, 0, 0, 0.7);
      border: none;
      color: #fff;
      font-size: 30px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-box .close-btn:hover {
      background: #e50914;
    }

    .player-box .movie-title {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      margin: 4px 0 12px;
      padding-right: 50px;
    }

    .player-box iframe {
      width: 100%;
      height: 460px;
      border: none;
      border-radius: 12px;
      background: #000;
    }

    .player-box .source-selector {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .player-box .source-selector button {
      padding: 8px 20px;
      border: 1px solid #2a2a2a;
      border-radius: 60px;
      background: transparent;
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .player-box .source-selector button:hover,
    .player-box .source-selector button.active {
      background: #e50914;
      color: #fff;
      border-color: #e50914;
    }

    .player-box .error-msg {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    /* ===== LOADING / EMPTY ===== */
    .loading,
    .empty {
      text-align: center;
      color: #666;
      padding: 60px 0;
      font-size: 18px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .search-box input {
        width: 100%;
      }
      .search-box input:focus {
        width: 100%;
      }
      .hero {
        padding: 30px 24px 24px;
        min-height: 220px;
      }
      .hero-content h2 {
        font-size: 26px;
      }
      .row {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }
      .movie-card img {
        height: 190px;
      }
      .player-box iframe {
        height: 240px;
      }
      .player-box .movie-title {
        font-size: 17px;
      }
      .nav-links {
        gap: 14px;
        font-size: 13px;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .player-box iframe {
        height: 380px;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0b0b;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #444;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">Flix<span>Lab</span></div>
    <div class="nav-links">
      <a href="#" class="active">Home</a>
      <a href="#">TV Shows</a>
      <a href="#">Movies</a>
      <a href="#">New & Popular</a>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search titles..." />
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <!-- ===== HERO BANNER ===== -->
  <div class="hero" id="heroBanner">
    <div class="hero-content">
      <div class="badge">Trending Now</div>
      <h2 id="heroTitle">Loading...</h2>
      <p id="heroDesc">Fetching the latest hit...</p>
      <div class="meta">
        <span id="heroRating">⭐ 0.0</span>
        <span id="heroYear">—</span>
      </div>
      <div class="btn-group">
        <button class="play-btn" id="heroPlayBtn">▶ Play</button>
        <button class="info-btn" id="heroInfoBtn">More Info</button>
      </div>
    </div>
  </div>

  <!-- ===== MOVIE ROWS ===== -->
  <div class="section">
    <div class="section-header">
      <h3>🔥 Popular Movies</h3>
    </div>
    <div class="row" id="popularRow">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h3>⭐ Top Rated</h3>
    </div>
    <div class="row" id="topRatedRow">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h3>🍿 Now Playing</h3>
    </div>
    <div class="row" id="nowPlayingRow">
      <div class="loading">Loading...</div>
    </div>
  </div>
</div>

<!-- ===== VIDEO PLAYER OVERLAY ===== -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-box">
    <button class="close-btn" id="closePlayerBtn">&times;</button>
    <div class="movie-title" id="playerTitle">Movie Title</div>
    <iframe id="playerIframe" src="" allowfullscreen></iframe>
    <div class="source-selector" id="sourceSelector">
      <button class="active" data-src="vidsrc">VidSrc</button>
      <button data-src="2embed">2Embed</button>
      <button data-src="embed">Embed</button>
    </div>
    <div class="error-msg" id="playerError">⚠️ Failed to load video. Try another source.</div>
  </div>
</div>

<script>
  // ================================================================
  // CONFIG – GET YOUR FREE TMDB API KEY
  // ================================================================
  const TMDB_API_KEY = 'e0a7266a5d0e95c36475f349d8bc0a5a'; // ← PALITAN ITO
  const BASE_IMAGE = 'https://image.tmdb.org/t/p/w500';
  const BACKDROP_IMAGE = 'https://image.tmdb.org/t/p/original';

  // ================================================================
  // DOM REFS
  // ================================================================
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');

  const heroBanner = document.getElementById('heroBanner');
  const heroTitle = document.getElementById('heroTitle');
  const heroDesc = document.getElementById('heroDesc');
  const heroRating = document.getElementById('heroRating');
  const heroYear = document.getElementById('heroYear');
  const heroPlayBtn = document.getElementById('heroPlayBtn');
  const heroInfoBtn = document.getElementById('heroInfoBtn');

  const popularRow = document.getElementById('popularRow');
  const topRatedRow = document.getElementById('topRatedRow');
  const nowPlayingRow = document.getElementById('nowPlayingRow');

  const playerOverlay = document.getElementById('playerOverlay');
  const closePlayerBtn = document.getElementById('closePlayerBtn');
  const playerIframe = document.getElementById('playerIframe');
  const playerTitle = document.getElementById('playerTitle');
  const sourceSelector = document.getElementById('sourceSelector');
  const playerError = document.getElementById('playerError');

  // ================================================================
  // FETCH MOVIES
  // ================================================================
  async function fetchMovies(endpoint, targetRow, limit = 12) {
    try {
      const res = await fetch(
        `https://api.themoviedb.org/3/movie/${endpoint}?api_key=${TMDB_API_KEY}&language=en-US&page=1`
      );
      const data = await res.json();
      const movies = data.results?.slice(0, limit) || [];
      renderMovies(movies, targetRow);
      return movies;
    } catch {
      targetRow.innerHTML = `<div class="empty">⚠️ Error loading movies. Check API key.</div>`;
      return [];
    }
  }

  // ================================================================
  // RENDER MOVIES
  // ================================================================
  function renderMovies(movies, container) {
    if (!movies || movies.length === 0) {
      container.innerHTML = `<div class="empty">No movies found.</div>`;
      return;
    }

    container.innerHTML = movies.map(m => {
      const poster = m.poster_path
        ? `${BASE_IMAGE}${m.poster_path}`
        : 'https://via.placeholder.com/500x750/1a1a1a/444?text=No+Poster';
      const rating = m.vote_average ? m.vote_average.toFixed(1) : '—';
      const year = m.release_date ? m.release_date.slice(0, 4) : '—';
      return `
        <div class="movie-card" data-id="${m.id}" data-title="${m.title}">
          <img src="${poster}" alt="${m.title}" loading="lazy" />
          <div class="info">
            <h4>${m.title}</h4>
            <div class="meta">
              <span>${year}</span>
              <span class="rating">⭐ ${rating}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.movie-card').forEach(card => {
      card.addEventListener('click', () => {
        openPlayer(card.dataset.id, card.dataset.title);
      });
    });
  }

  // ================================================================
  // SET HERO
  // ================================================================
  function setHero(movie) {
    if (!movie) return;
    heroTitle.textContent = movie.title || 'Untitled';
    heroDesc.textContent = movie.overview || 'No description available.';
    heroRating.textContent = `⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : '—'}`;
    heroYear.textContent = movie.release_date ? movie.release_date.slice(0, 4) : '—';

    const backdrop = movie.backdrop_path
      ? `${BACKDROP_IMAGE}${movie.backdrop_path}`
      : movie.poster_path
      ? `${BASE_IMAGE}${movie.poster_path}`
      : null;

    if (backdrop) {
      heroBanner.style.backgroundImage = `url(${backdrop})`;
      heroBanner.style.backgroundSize = 'cover';
      heroBanner.style.backgroundPosition = 'center 20%';
    } else {
      heroBanner.style.background = '#141414';
    }

    heroPlayBtn.onclick = (e) => {
      e.stopPropagation();
      openPlayer(movie.id, movie.title);
    };

    heroInfoBtn.onclick = (e) => {
      e.stopPropagation();
      showInfo(movie.id);
    };

    heroBanner.onclick = (e) => {
      if (e.target.closest('button')) return;
      openPlayer(movie.id, movie.title);
    };
  }

  // ================================================================
  // SEARCH
  // ================================================================
  async function searchMovies(query) {
    if (!query.trim()) { loadAll(); return; }

    try {
      const res = await fetch(
        `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&page=1`
      );
      const data = await res.json();
      const results = data.results || [];

      popularRow.innerHTML = `<div style="grid-column:1/-1; padding:8px 0; color:#fff; font-size:18px;">🔍 Results for "${query}"</div>`;
      renderMovies(results, popularRow);
      topRatedRow.innerHTML = '';
      nowPlayingRow.innerHTML = '';

      if (results.length > 0) setHero(results[0]);
      else {
        heroTitle.textContent = 'No results found';
        heroDesc.textContent = 'Try a different search term.';
      }
    } catch {
      popularRow.innerHTML = `<div class="empty">Search error.</div>`;
    }
  }

  // ================================================================
  // PLAYER
  // ================================================================
  function openPlayer(movieId, title) {
    playerTitle.textContent = title;
    playerError.style.display = 'none';
    playerOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    const active = sourceSelector.querySelector('button.active');
    loadStream(active ? active.dataset.src : 'vidsrc', movieId);
    // Store movieId for source switching
    playerOverlay.dataset.movieId = movieId;
  }

  function closePlayer() {
    playerOverlay.classList.remove('active');
    document.body.style.overflow = '';
    playerIframe.src = '';
  }

  function loadStream(source, movieId) {
    if (!movieId) movieId = playerOverlay.dataset.movieId;
    if (!movieId) return;
    playerError.style.display = 'none';

    let embedUrl = '';
    switch (source) {
      case 'vidsrc':
        embedUrl = `https://vidsrc.to/embed/movie/${movieId}`;
        break;
      case '2embed':
        embedUrl = `https://www.2embed.cc/embed/${movieId}`;
        break;
      case 'embed':
        embedUrl = `https://embed.su/embed/movie/${movieId}`;
        break;
      default:
        embedUrl = `https://vidsrc.to/embed/movie/${movieId}`;
    }

    playerIframe.src = embedUrl;

    sourceSelector.querySelectorAll('button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.src === source);
    });
  }

  // ================================================================
  // INFO (simple alert)
  // ================================================================
  async function showInfo(movieId) {
    try {
      const res = await fetch(
        `https://api.themoviedb.org/3/movie/${movieId}?api_key=${TMDB_API_KEY}`
      );
      const m = await res.json();
      alert(
        `🎬 ${m.title}\n\n⭐ Rating: ${m.vote_average ? m.vote_average.toFixed(1) + '/10' : '—'}\n` +
        `📅 Release: ${m.release_date || '—'}\n` +
        `🎬 Genres: ${m.genres ? m.genres.map(g => g.name).join(', ') : '—'}\n` +
        `⏱ Runtime: ${m.runtime ? m.runtime + ' min' : '—'}\n\n` +
        `${m.overview || 'No overview available.'}`
      );
    } catch {
      alert('Error loading details.');
    }
  }

  // ================================================================
  // LOAD ALL
  // ================================================================
  async function loadAll() {
    const popular = await fetchMovies('popular', popularRow, 12);
    await fetchMovies('top_rated', topRatedRow, 12);
    await fetchMovies('now_playing', nowPlayingRow, 12);
    if (popular.length > 0) setHero(popular[0]);
  }

  // ================================================================
  // EVENT LISTENERS
  // ================================================================
  searchBtn.addEventListener('click', () => searchMovies(searchInput.value));
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchMovies(searchInput.value);
  });

  closePlayerBtn.addEventListener('click', closePlayer);
  playerOverlay.addEventListener('click', (e) => {
    if (e.target === playerOverlay) closePlayer();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePlayer();
  });

  sourceSelector.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    sourceSelector.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadStream(btn.dataset.src);
  });

  // ================================================================
  // INIT
  // ================================================================
  if (TMDB_API_KEY === 'YOUR_TMDB_API_KEY') {
    popularRow.innerHTML = `
      <div class="empty" style="padding:40px; background:#141414; border-radius:16px; border:1px solid #2a2a2a; grid-column:1/-1;">
        <p style="font-size:18px; margin-bottom:8px;">🔑 Kailangan mo ng TMDB API key</p>
        <p style="font-size:14px; color:#666;">
          Pumunta sa <a href="https://www.themoviedb.org/signup" target="_blank" style="color:#e50914;">themoviedb.org</a>,
          gumawa ng account, at kumuha ng API key. <br />
          Pagkatapos, palitan ang <code style="background:#222; padding:2px 8px; border-radius:4px;">TMDB_API_KEY</code> sa script.
        </p>
      </div>
    `;
    topRatedRow.innerHTML = '';
    nowPlayingRow.innerHTML = '';
    heroTitle.textContent = 'API Key Required';
    heroDesc.textContent = 'Please add your TMDB API key to the script.';
  } else {
    loadAll();
  }

  console.log('[FlixLab] Pure movie streaming site ready.');
</script>
</body>
</html>
